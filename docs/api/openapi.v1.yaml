  /api/v1/articles/{id}/view:
    post:
      operationId: viewArticle
      tags: [Article]
      summary: 阅读量 +1（带防刷去重）
      description: >
        **可选鉴权**：`security: [{}, {bearerAuth: []}]` 是 OpenAPI 表达「可匿名、也可携带令牌」的标准写法。
        携带 Bearer 则按 `user_id` 去重，否则按 `ip+ua` 哈希去重（§2.4）。
        各端生成客户端须配置「持有令牌则自动附加 Authorization」，否则登录用户会退化到匿名去重分支——
        这是契约驱动生成的已知注意点，已在 02 §3.3 列为交付项。


        仅 `published` 文章可计数；draft/pending 一律 404（含作者本人），避免未发布内容被计数探测存在性。
        本端点只递增 view_count，不写入阅读历史；阅读历史由鉴权端点 `POST /me/history` 上报。
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        type: object
                        properties:
                          viewCount: {type: integer}
        '404':
          description: 文章不存在或未发布
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 3001
                message: 资源不存在
                data:
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
