      tags: [Comment]
      summary: 评论人工复核置位（editor / admin）
      description: >
        `reviewing` 态的**唯一进出路径**。没有本端点时，reviewing 既进不去也出不来，
        是 100% 不可达的死胡同状态（第三轮复审 P1）。


        语义：editor 与 admin 可把任意评论置为 approved / rejected / reviewing；
        置为当前同一状态时幂等返回 200；置为 approved 时后端清空 rejectedReason。
        自动流（发表评论）只产出 approved / rejected，reviewing 只能由本端点人工置位。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentModerateRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Comment'
        '403':
          description: 无权限（非 admin）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 2001
                message: 无权限执行该操作
                data:
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
        '404':
          description: 评论不存在
