    get:
      tags: [Admin]
      summary: 用户详情
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/User'
        '404':
          description: 用户不存在
    patch:
      tags: [Admin]
      summary: 变更角色 / 状态 / 会员等级
      description: >
        admin 专用。可改 role（member/author/admin）、status（active/disabled）、
        level（会员等级，仅展示用，默认 1，admin 可上调以体现会员体系）。
        注册默认角色为 member，admin 经此端点将 member 晋升为 author。
      parameters:
        - name: id
          in: path
          required: true
          schema: { type: integer }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                  enum: [admin, author, member]
                status:
                  type: string
                  enum: [active, disabled]
                level:
                  type: integer
                  description: 会员等级，仅展示用，仅 admin 可改
              required: []
      responses:
        '200':
          description: 成功
          content:
