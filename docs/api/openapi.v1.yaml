                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/User'
        '400':
          description: 参数校验失败（code 4001）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ValidationErrorList'
              example:
                code: 4001
                message: 参数校验失败
                data:
                  errors:
                    - field: email
                      message: 邮箱格式不正确
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
        '409':
          description: 邮箱已被占用（code 3002）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 3002
                message: 资源冲突（唯一约束或引用占用）
                data:
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
  /api/v1/me/change-password:
