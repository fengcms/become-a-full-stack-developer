  /api/v1/admin/users/{id}/reset-password:
    post:
      operationId: adminResetPassword
      tags: [Admin]
      summary: 管理员重置用户密码
      description: >
        v1 不做邮件找回密码（引入 SMTP/第三方依赖，与 Non-goals 冲突），
        本端点是「忘记密码」的唯一兜底路径，避免账号死锁。
        重置后作废该用户全部 refreshToken。
        教学价值：密码哈希不可逆，但管理员仍能重置——权限边界与信任模型的经典讨论（B-11）。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AdminResetPasswordRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: 新密码强度不足（code 4001）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ValidationErrorList'
              example:
                code: 4001
                message: 参数校验失败
                data:
                  errors:
                    - field: email
                      message: 邮箱格式不正确
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
        '403':
          description: 无权限（非 admin）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 2001
                message: 无权限执行该操作
                data:
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
        '404':
          description: 用户不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 3001
                message: 资源不存在
                data:
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
