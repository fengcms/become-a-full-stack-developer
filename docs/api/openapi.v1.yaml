  /api/v1/search:
    get:
      operationId: search
      tags: [Search]
      summary: 全文搜索
      description: 跨文章标题/正文与会员昵称检索；type 决定返回文章列表还是会员列表。
      security: []
      parameters:
        - name: q
          in: query
          required: true
          schema: {type: string}
        - name: type
          in: query
          required: false
          schema:
            type: string
            enum: [article, member]
            default: article
        - name: page
          in: query
          required: false
          schema: {type: integer, default: 1, minimum: 1}
        - name: pageSize
          in: query
          required: false
          schema: {type: integer, default: 10, minimum: 1, maximum: 50}
        - name: sort
          in: query
          required: false
          schema:
            type: string
            enum:
              - publishedAt
              - "-publishedAt"
              - viewCount
              - "-viewCount"
              - createdAt
              - "-createdAt"
            default: "-publishedAt"
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/SearchResult'
        '400':
          description: 关键词为空（code 4001）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 4001
                message: 参数校验失败
                data:
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
