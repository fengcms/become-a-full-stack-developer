  /api/v1/articles/{idOrSlug}/comments:
    get:
      tags: [Comment]
      summary: 文章评论（楼中楼平面展开）
      description: 未发布文章对匿名返回 404；仅作者/管理员可见未发布文章的评论。
      security: []
      parameters:
        - name: idOrSlug
          in: path
          required: true
          schema: { type: string }
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/CommentPage'
        '404':
          description: 文章不存在（或未发布且匿名访问）
    post:
      tags: [Comment]
      summary: 发表评论（自动敏感词过滤）
      description: 命中转星号；违规比率超阈值则 rejected，否则 approved；详见 02 文档 §2.5
      parameters:
        - name: idOrSlug
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                content: { type: string }
                parentId: { type: integer, nullable: true }
              required: [content]
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Comment'
        '403':
          description: 无权限
  /api/v1/comments/{id}:
    delete:
      tags: [Comment]
      summary: 删除评论
      description: 删除评论时级联删除其所有子回复（parent_id 指向它的行一并删除），避免孤儿回复。
      parameters:
