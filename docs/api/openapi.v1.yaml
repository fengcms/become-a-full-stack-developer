        admin 专用。可改 role（member/editor/admin）、status（active/disabled）、
        level（会员等级，仅展示用，默认 1，admin 可上调以体现会员体系）。
        注册默认角色为 member，admin 经此端点将 member 晋升为 editor。
        置 status=disabled 即「封号」：该用户无法登录/刷新，公开主页 404，但其已发布文章仍公开。
        v1 **不提供物理删除用户**的端点（禁用即软删除，见 02 §九）。
