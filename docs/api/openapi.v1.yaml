openapi: 3.1.0
info:
  title: 文章系统 API
  description: >
    《成为一个全栈开发工程师》系列项目的统一 API 契约 v1。
    Node 后端与 Go 后端均按此实现；React/Vue/Next/Flutter/Taro 各端均按此对接。
    契约变更必须先改此文件，再改实现。
    本契约作为「单一事实来源」，所有 200 响应均给出完整 schema，供各端自动生成类型。


    三条贯穿全契约的硬规则（详见 02 文档）：

    1. 公开可见性铁律：公开列表只返回 published，未发布内容对匿名返回 404（02 §三）。

    2. 实体生命周期完整：每个实体都有可达的创建/读取/变更/删除路径，不存在契约沉默的孤儿实体或死胡同状态（02 §3.1）。

    3. 约束尽量机器化：可枚举的约束一律下沉到 enum / security / responses，不靠散文自觉（02 §3.2 机器强制约束清单）。


    可选鉴权端点采用 OpenAPI 标准写法 `security: [{}, {bearerAuth: []}]`
    （空安全需求对象表示允许匿名），各端生成客户端须配置「持有令牌则自动附加」，见 02 §3.3。
  version: 1.5.0
servers:
  - url: http://localhost:3000
    description: 本地开发（Node 后端）
  - url: http://localhost:8080
    description: 本地开发（Go 后端重写）
tags:
  - name: Auth
  - name: Article
  - name: Category
  - name: Tag
  - name: Comment
  - name: Upload
  - name: Member
  - name: Site
  - name: Admin
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Page:
      name: page
      in: query
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页条数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: >
        排序，采用「带符号字段名」约定：字段名本身表示正序（asc），前缀 `-` 表示倒序（desc）。
        例如 `publishedAt` = 按发布时间正序，`-publishedAt` = 按发布时间倒序；`-viewCount` = 按阅读量倒序。
        枚举穷举全部合法组合，生成客户端即受约束（不再是散文白名单）。
        跨实现一致性规定：`publishedAt` 为 null 的行（draft/pending）以 `createdAt` 参与比较
        （等价 `COALESCE(published_at, created_at)`），避免 SQLite 与 PostgreSQL 的 NULL 排序默认值差异；
        末位统一追加 `id desc` 作为稳定排序键，保证分页不重不漏。
      schema:
        type: string
        enum:
          - publishedAt
          - "-publishedAt"
          - viewCount
          - "-viewCount"
          - createdAt
          - "-createdAt"
        default: "-publishedAt"
    FilterCategory:
      name: category
      in: query
      description: 按分类 **slug** 精确匹配（非 id、非 name）。不含子分类，只匹配该分类自身
      schema:
        type: string
    FilterTag:
      name: tag
      in: query
      description: 按标签 **slug** 精确匹配（非 id、非 name）
      schema:
        type: string
    FilterKeyword:
      name: keyword
      in: query
      description: >
        关键词，匹配 `title` + `summary` 两个字段的子串（大小写不敏感），**不含 content 全文**。
        全文检索是 M1-19 的独立议题，v1 契约不纳入，避免 Node 与 Go 因检索范围不同而分歧
      schema:
        type: string
  schemas:
    ApiResponse:
      type: object
      description: 统一响应信封。data 为业务数据，无数据时可为 null。
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
          example: 0
        message:
          type: string
          example: ok
        data:
          nullable: true
          description: 业务数据；无数据时省略或为 null
        requestId:
          type: string
          example: req_8f3a1b2c
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 时间戳，与业务字段时间格式保持一致
          example: "2026-08-10T12:00:00Z"
      required: [code, message, requestId, timestamp]
    Pagination:
      type: object
      properties:
        page: {type: integer}
        pageSize: {type: integer}
        total: {type: integer}
        totalPages: {type: integer}
      required: [page, pageSize, total, totalPages]
    ArticlePage:
      type: object
      description: 文章分页结果，list 项为 ArticleSummary（不含 content 全文）
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/ArticleSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required: [list, pagination]
    UserPage:
      type: object
      description: 用户分页结果
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required: [list, pagination]
    CommentPage:
      type: object
      description: 评论分页结果（楼中楼平面展开，由 parentId 关联）
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required: [list, pagination]
    AttachmentPage:
      type: object
      description: 附件分页结果
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required: [list, pagination]
    User:
      type: object
      description: 用户对象；密码哈希绝不出现在此结构中
      properties:
        id: {type: integer}
        username: {type: string}
        email:
          type: string
          description: 邮箱，唯一。仅本人（/me/profile）与 admin（/users）可见，公开端点不返回
        nickname: {type: string}
        avatar: {type: string, nullable: true}
        role:
          type: string
          enum: [admin, editor, member]
          description: 三角色：member=普通会员（仅阅读/评论）；editor=内容编辑，管理全站文章/评论/分类/标签，但不可管理用户/角色/站点配置；admin=后台管理员（含用户/角色/站点配置）
        status:
          type: string
          enum: [active, disabled]
          description: disabled 账号无法登录与刷新（401 / code 1005），其公开主页返回 404
        level:
          type: integer
          default: 1
          description: 会员等级，仅展示用，无业务功能；默认 1，仅 admin 可改（见 PATCH /users/{id}）
        createdAt: {type: string, format: date-time}
      required: [id, username, nickname, role, status]
    MemberProfile:
      type: object
      description: 会员公开主页数据（不含 email 等隐私字段）
      properties:
        id: {type: integer}
        nickname: {type: string}
        avatar: {type: string, nullable: true}
        level: {type: integer}
        articleCount: {type: integer}
        articles:
          type: array
          description: 该会员的 published 文章列表（不含 content 全文）
          items:
            $ref: '#/components/schemas/ArticleSummary'
      required: [id, nickname, level, articleCount]
    Article:
      type: object
      description: 文章完整对象（含 content 全文，仅详情/管理接口返回）
      properties:
        id: {type: integer}
        title: {type: string}
        slug:
          type: string
          nullable: true
          description: URL 别名，可选；留空时前台用 id 路由。仅管理员手动填且需唯一
        summary: {type: string, nullable: true}
        content: {type: string}
        coverImage: {type: string, nullable: true}
        authorId: {type: integer}
        authorName: {type: string}
        categoryId: {type: integer, nullable: true}
        categoryName: {type: string, nullable: true}
        tags:
          type: array
          items: {type: string}
        status:
          type: string
          enum: [draft, pending, published]
        viewCount: {type: integer}
        publishedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      required: [id, title, content, authorId, status]
    ArticleSummary:
      type: object
      description: 文章摘要（列表/收藏/会员主页复用，不含 content 全文）
      properties:
        id: {type: integer}
        title: {type: string}
        slug:
          type: string
          nullable: true
        summary: {type: string, nullable: true}
        coverImage: {type: string, nullable: true}
        authorId: {type: integer}
        authorName: {type: string}
        categoryId: {type: integer, nullable: true}
        categoryName: {type: string, nullable: true}
        tags:
          type: array
          items: {type: string}
        status:
          type: string
          enum: [draft, pending, published]
        viewCount: {type: integer}
        publishedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      required: [id, title, authorId, status]
    Category:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        slug: {type: string}
        description: {type: string, nullable: true}
        parentId: {type: integer, nullable: true}
        sortOrder: {type: integer}
      required: [id, name, slug]
    CategoryNode:
      type: object
      description: 分类树节点（递归）
      properties:
        id: {type: integer}
        name: {type: string}
        slug: {type: string}
        description: {type: string, nullable: true}
        sortOrder: {type: integer}
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
    Tag:
      type: object
      properties:
        id: {type: integer}
        name: {type: string}
        slug: {type: string}
        articleCount: {type: integer}
      required: [id, name, slug]
    Comment:
      type: object
      properties:
        id: {type: integer}
        articleId: {type: integer}
        userId: {type: integer}
        userName: {type: string}
        parentId: {type: integer, nullable: true}
        content:
          type: string
          description: 展示内容，已做敏感词转星号处理
        status:
          type: string
          enum: [approved, rejected, reviewing]
          description: >
            approved=通过（转义后展示）；rejected=违规比率超阈值不予展示；reviewing=人工复核中。
            自动流只产出 approved / rejected；reviewing 仅能由 `PATCH /comments/{id}/status`（admin）置位与移出。
            公开列表 `GET /articles/{idOrSlug}/comments` 只返回 approved
        rejectedReason: {type: string, nullable: true}
        createdAt: {type: string, format: date-time}
      required: [id, articleId, userId, content, status]
    CommentModerateRequest:
      type: object
      description: 评论人工复核置位入参（admin 专用）
      properties:
        status:
          type: string
          enum: [approved, rejected, reviewing]
          description: 目标状态。置为当前同一状态时幂等返回 200
        reason:
          type: string
          nullable: true
          description: 可选，写入 rejectedReason（置为 approved 时后端清空该字段）
      required: [status]
    ReadingHistoryItem:
      type: object
      description: 阅读历史条目，文章摘要 + 阅读进度
      properties:
        article:
          $ref: '#/components/schemas/ArticleSummary'
        lastReadAt: {type: string, format: date-time}
        progress:
          type: integer
          description: 阅读进度百分比 0-100，可选
      required: [article, lastReadAt]
    HistoryPage:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/ReadingHistoryItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required: [list, pagination]
    Attachment:
      type: object
      description: >
        附件 / 上传资源。`POST /upload` 返回本结构（上传即落 Attachment 表），
        `GET /me/attachments` 列举本人上传，`DELETE /attachments/{id}` 删除。
        它不是内部影子表，而是契约对外暴露的一等实体。
      properties:
        id: {type: integer}
        userId:
          type: integer
          description: 上传者，由令牌推断，不由客户端传入
        articleId:
          type: integer
          nullable: true
          description: 可选关联的文章；由上传时的表单字段 articleId 写入（编辑器内上传场景）
        url: {type: string}
        storage:
          type: string
          enum: [r2, local]
          description: 本次实际使用的存储后端，由 STORAGE_DRIVER 决定（见 02 §2.6）
        mimeType: {type: string}
        size:
          type: integer
          description: 字节数
        createdAt: {type: string, format: date-time}
      required: [id, userId, url, storage, mimeType, size]
    ValidationError:
      type: object
      description: 字段级校验错误明细
      properties:
        field: {type: string, description: 出错的字段名}
        message: {type: string, description: 错误说明}
      required: [field, message]
    ValidationErrorList:
      type: object
      description: 4001 参数校验失败的 data 结构
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
      required: [errors]
    LoginRequest:
      type: object
      properties:
        username: {type: string}
        password: {type: string}
      required: [username, password]
    RegisterRequest:
      type: object
      description: 注册入参。注册默认角色为 member；admin 后续经 PATCH /users/{id} 晋升为 editor。
      properties:
        username: {type: string}
        email: {type: string}
        password: {type: string}
        nickname: {type: string}
      required: [username, email, password]
    AuthResult:
      type: object
      description: 登录/刷新结果。refreshToken 用于浏览器 HttpOnly Cookie 与移动端安全存储两种载体
      properties:
        accessToken: {type: string}
        expiresIn:
          type: integer
          description: access token 有效期（秒）
        refreshToken:
          type: string
          description: >
            刷新令牌。浏览器端由 Set-Cookie 写入 HttpOnly+SameSite Cookie；
            移动端返回此字段存于安全存储，刷新时置于请求体。
            采用**旋转策略**：每次刷新签发新值并作废旧值（见 POST /auth/refresh）
        user:
          $ref: '#/components/schemas/User'
      required: [accessToken, expiresIn, user]
    RefreshRequest:
      type: object
      description: 刷新访问令牌。浏览器端通常无需传体（用 Cookie）；移动端将 refreshToken 置于体
      properties:
        refreshToken:
          type: string
          nullable: true
      required: []
    ArticleCreate:
      type: object
      description: 创建/更新文章入参
      properties:
        title: {type: string}
        summary: {type: string, nullable: true}
        content: {type: string}
        coverImage: {type: string, nullable: true}
        categoryId: {type: integer, nullable: true}
        tags:
          type: array
          items: {type: string}
        slug:
          type: string
          nullable: true
          description: >
            可选的 URL 别名。权限约束（与 status 同规格显式化）：
            **member 传入 slug 时后端一律忽略**（创建时留空、更新时保持原值），不报错也不写入；editor 与 admin 可直接指定。slug 需全局唯一（软删除行不占用，见 02 §2.2 部分唯一索引），
            重复则返回 409 / code 3002；命中预留子路径黑名单（tree/view/submit 等）返回 400 / code 4001
        status:
          type: string
          enum: [draft, pending, published]
          description: >
            目标状态。权限约束：member 传入 published 时后端忽略并降级为 pending（会员无法直接发布）；
            editor 与 admin 可直接置为 published。
      required: [title, content]
    HistoryReport:
      type: object
      description: 上报阅读进度（写入/更新 ReadingLog）
      properties:
        articleId: {type: integer}
        progress:
          type: integer
          nullable: true
          description: 阅读进度百分比 0-100，可选；不传则仅记录 lastReadAt
      required: [articleId]
    ChangePasswordRequest:
      type: object
      properties:
        oldPassword: {type: string}
        newPassword: {type: string}
      required: [oldPassword, newPassword]
    AdminResetPasswordRequest:
      type: object
      description: >
        admin 重置他人密码。v1 不做邮件找回（Non-goal，见 02 §九），
        此端点是「忘记密码」的唯一兜底路径，同时是「哈希不可逆但管理员仍能重置」这一权衡的教学素材
      properties:
        newPassword: {type: string}
      required: [newPassword]
    ProfileUpdateRequest:
      type: object
      description: 更新本人资料。email 唯一，冲突返回 409 / code 3002
      properties:
        nickname: {type: string}
        avatar: {type: string, nullable: true}
        email:
          type: string
          description: 可选。v1 无邮箱验证流程（Non-goal），改后立即生效，仅做唯一性校验
      required: []
    OAuthCallbackRequest:
      type: object
      description: 第三方登录回调入参（M3-09 扩展点）
      properties:
        code: {type: string, description: 第三方授权码}
        state: {type: string, nullable: true}
        redirectUri: {type: string, nullable: true}
      required: [code]
    SiteSetting:
      type: object
      description: 站点基础配置（站点名称/描述/Logo）。单条记录，由 admin 经 PATCH /admin/site/settings 维护；前台经 GET /site/settings 读取用于页头/页脚展示。
      properties:
        id: {type: integer}
        siteName: {type: string, description: 站点名称}
        siteDescription: {type: string, description: 站点描述（用于 SEO meta / 页脚简介）}
        logoUrl: {type: string, nullable: true, description: Logo 图片地址（经上传端点获得）}
        updatedAt: {type: string, format: date-time}
      required: [id, siteName, siteDescription]
    SiteSettingUpdate:
      type: object
      description: 站点配置更新入参，字段均可选（仅传需变更项）。
      properties:
        siteName: {type: string}
        siteDescription: {type: string}
        logoUrl: {type: string, nullable: true}
      required: []
    ErrorCode:
      type: integer
      description: 业务错误码。0 表示成功；>0 见错误码表（1xxx 认证 / 2xxx 授权 / 3xxx 资源 / 4xxx 参数 /
        5xxx 服务）。
      enum:
        - 0
        - 1001
        - 1002
        - 1003
        - 1004
        - 1005
        - 2001
        - 3001
        - 3002
        - 3003
        - 4001
        - 5000
security:
  - bearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      operationId: registerUser
      tags: [Auth]
      summary: 注册
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AuthResult'
        '400':
          description: 参数校验失败（code 4001，data 含字段级 errors 明细）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ValidationErrorList'
              example:
                code: 4001
                message: 参数校验失败
                data:
                  errors:
                    - field: email
                      message: 邮箱格式不正确
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
        '409':
          description: 用户名或邮箱已被占用（code 3002）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 3002
                message: 资源冲突（唯一约束或引用占用）
                data:
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: 登录
      description: 账号 status=disabled 时拒绝登录，返回 401 / code 1005（不返回 
        403，避免暴露账号存在性）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AuthResult'
        '401':
          description: 用户名或密码错误（code 1001）；或账号已被禁用（code 1005）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 1001
                message: 用户名或密码错误
                data:
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: 刷新访问令牌
      description: >
        浏览器端通过 HttpOnly Cookie 携带 refreshToken；移动端将 refreshToken 置于请求体。
        读取优先级：Cookie 优先，缺失取请求体，两者皆无 → 401 / code 1003。


        **旋转策略（强制）**：每次刷新成功即作废旧 refreshToken 并签发新值（响应体与 Set-Cookie 同时更新）。
        旧令牌再次使用视为重放攻击 → 401 / code 1003，并连带作废该用户的整个令牌家族（须重新登录）。
        账号 status=disabled 时刷新一律失败（401 / code 1005）。
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 刷新成功（返回全新的 accessToken 与 refreshToken）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AuthResult'
        '401':
          description: 刷新令牌失效 / 已被旋转作废 / 重放（code 1003）；令牌缺失（code 1004）或无效（code 
            1002）；或账号已被禁用（code 1005）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 1003
                message: 刷新令牌失效，请重新登录
                data:
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
