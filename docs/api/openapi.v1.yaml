      summary: 修改密码
      description: >
        会员中心「个人设置」的密码修改端点，需旧密码。校验 oldPassword 后更新 password_hash，
        并作废该用户全部 refreshToken（强制其它设备重新登录）。
        忘记旧密码时，v1 的唯一兜底是 admin 重置（`POST /admin/users/{id}/reset-password`）。
