  /api/v1/upload:
    post:
      operationId: uploadFile
      x-authz:
        minRole: member
      tags: [Upload]
      summary: 资源上传（R2 为主 / 本地磁盘兜底，由 STORAGE_DRIVER 配置驱动）
      description: >
        上传即落 Attachment 表并返回**完整 Attachment 实体**（含 id / mimeType / size / storage），
        不再只返回 `{url}`——否则 Attachment 模型的字段在契约中无处落地（第三轮复审 P2）。
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              x-max-size-bytes: 10485760
              x-accepted-mime-types:
                - image/png
                - image/jpeg
                - image/gif
                - image/webp
                - image/svg+xml
                - application/pdf
              properties:
                file:
                  type: string
                  format: binary
                  description: 文件本体；大小须 <= x-max-size-bytes（10MB），类型须命中 x-accepted-mime-types，否则 400 / code 4001
                articleId:
                  type: integer
                  nullable: true
                  description: 可选。从文章编辑器内上传时传入，把附件关联到该文章（写入 
                    Attachment.articleId）
              required: [file]
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Attachment'
        '400':
          description: 文件类型或大小不合法（code 4001）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ValidationErrorList'
              example:
                code: 4001
                message: 参数校验失败
                data:
                  errors:
                    - field: file
                      message: 文件类型或大小不合法（须 <= 10MB 且为图片/PDF）
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
