      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
        '400':
          description: 参数校验失败（code 4001，如旧密码错误或新密码强度不足）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ValidationErrorList'
              example:
                code: 4001
                message: 参数校验失败
                data:
                  errors:
                    - field: email
                      message: 邮箱格式不正确
                requestId: req_8f3a1b2c
