openapi: 3.1.0
info:
  title: 文章系统 API
  description: >
    《成为一个全栈开发工程师》系列项目的统一 API 契约 v1。
    Node 后端与 Go 后端均按此实现；React/Vue/Next/Flutter/Taro 各端均按此对接。
    契约变更必须先改此文件，再改实现。
    本契约作为「单一事实来源」，所有 200 响应均给出完整 schema，供各端自动生成类型。


    三条贯穿全契约的硬规则（已在本契约内逐条定义，溯源细节见 02 文档）：

    1. 公开可见性铁律：公开列表只返回 published，未发布内容对匿名返回 404（02 §三）。

    2. 实体生命周期完整：每个实体都有可达的创建/读取/变更/删除路径，不存在契约沉默的孤儿实体或死胡同状态（02 §3.1）。

    3. 约束尽量机器化：可枚举的约束一律下沉到 enum / security / responses，不靠散文自觉（02 §3.2 机器强制约束清单）。

    注：本文档中「见 02 §x / 详见 02 文档」均为溯源注，契约语义与约束以本 OpenAPI 契约为准；授权求值规则见上文第 4 条，已自包含、无需参照其他文档。

    4. 授权求值（自包含，无需参照其他文档）：每个请求按下列确定性规则求值——① 角色层级 member(1) < editor(2) < admin(3)；② 匿名仅可访问未声明 `x-authz` 的公开端点（`security: []` 或可选鉴权 `[{}, {bearerAuth: []}]`）；③ 已登录且角色为 admin → 始终放行；④ 否则当且仅当满足以下任一条件时放行：(a) 用户角色层级 ≥ 端点 `x-authz.minRole` 层级，或 (b) 端点声明了 `x-authz.ownerOverride` 且用户对该 `ownerOverride.param` 指向的资源具有归属关系（即资源的 `ownerOverride.ownerField` 字段值 == 当前用户 id）；⑤ `/me/*` 端点为自我作用域（self-scoped）：路径主体恒为当前登录用户，等价于 ownerOverride{ownerField: userId}；含子资源路径参数的操作（如 /me/favorites/{articleId}）额外显式声明 ownerOverride{param: 子资源参数名, ownerField: userId} 以断言子资源归属当前用户。非 owner 角色仅在满足 ④(a)/④(b) 时放行，否则返回 403 / code 2001。端点 `x-authz` 示例：minRole: editor + ownerOverride: {param: id, ownerField: authorId}。


    可选鉴权端点采用 OpenAPI 标准写法 `security: [{}, {bearerAuth: []}]`
    （空安全需求对象表示允许匿名），各端生成客户端须配置「持有令牌则自动附加」，实现细节见 02 §3.3（以本契约为准）。
  version: 1.11.0
  x-api-version: 1
  x-rate-limit:
    description: >
      所有公开（未登录可访问）端点受网关层统一限流保护；超限返回 HTTP 429，
      带 Retry-After 头，业务 code 5001。鉴权端点不设此限。
      粒度：每个公开端点各自独立计数（非全局共享单桶）。限流键按客户端区分（按 IP 或令牌）。
    limit: 60
    window: 1m
    code: 5001
    scope: per-endpoint
    key: client
servers:
  - url: http://localhost:3000
    description: 本地开发（Node 后端）
  - url: http://localhost:8080
    description: 本地开发（Go 后端重写）
tags:
  - name: Auth
  - name: Article
  - name: Category
  - name: Tag
  - name: Comment
  - name: Upload
  - name: Member
  - name: Site
  - name: Search
  - name: Admin
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  responses:
    RateLimited:
      description: 触发限流（网关层统一施加于公开端点）。带 Retry-After 头，业务 code 5001
      headers:
        Retry-After:
          description: 建议重试等待秒数
          schema:
            type: integer
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          example:
            code: 5001
            message: 请求过于频繁，请稍后重试
            data:
            requestId: req_8f3a1b2c
            timestamp: '2026-08-10T12:00:00Z'
    Unauthorized:
      description: 未携带或携带无效/过期的访问令牌。code 1002 = 令牌无效或已过期；code 1004 = 未携带令牌（匿名访问受保护端点）
      content:
        application/json:
          schema:
            $ref: '#/components/schemas/ApiResponse'
          examples:
            token_missing:
              summary: 未携带访问令牌
              value:
                code: 1004
                message: 未携带访问令牌
                data:
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
            token_invalid:
              summary: 令牌无效或已过期
              value:
                code: 1002
                message: 令牌无效或已过期
                data:
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
  parameters:
    Page:
      name: page
      in: query
      description: 页码，从 1 开始
      schema:
        type: integer
        minimum: 1
        default: 1
    PageSize:
      name: pageSize
      in: query
      description: 每页条数
      schema:
        type: integer
        minimum: 1
        maximum: 100
        default: 20
    Sort:
      name: sort
      in: query
      description: >
        排序，采用「带符号字段名」约定：字段名本身表示正序（asc），前缀 `-` 表示倒序（desc）。
        例如 `publishedAt` = 按发布时间正序，`-publishedAt` = 按发布时间倒序；`-viewCount` = 按阅读量倒序。
        枚举穷举全部合法组合，生成客户端即受约束（不再是散文白名单）。
        跨实现一致性规定：`publishedAt` 为 null 的行（draft/pending）以 `createdAt` 参与比较
        （等价 `COALESCE(published_at, created_at)`），避免 SQLite 与 PostgreSQL 的 NULL 排序默认值差异；
        末位统一追加 `id desc` 作为稳定排序键，保证分页不重不漏。
      schema:
        type: string
        enum:
          - publishedAt
          - "-publishedAt"
          - viewCount
          - "-viewCount"
          - createdAt
          - "-createdAt"
        default: "-publishedAt"
    FilterCategory:
      name: category
      in: query
      description: 按分类 **slug** 精确匹配（非 id、非 name）。不含子分类，只匹配该分类自身
      schema:
        type: string
    FilterTag:
      name: tag
      in: query
      description: 按标签 **slug** 精确匹配（非 id、非 name）
      schema:
        type: string
    FilterKeyword:
      name: keyword
      in: query
      description: >
        关键词，匹配 `title` + `summary` 两个字段的子串（大小写不敏感），**不含 content 全文**。
        全文检索是 M1-19 的独立议题，v1 契约不纳入，避免 Node 与 Go 因检索范围不同而分歧
      schema:
        type: string
  schemas:
    ApiResponse:
      type: object
      description: 统一响应信封。data 为业务数据，无数据时可为 null。
      properties:
        code:
          $ref: '#/components/schemas/ErrorCode'
          example: 0
        message:
          type: string
          example: ok
        data:
          nullable: true
          description: 业务数据；无数据时省略或为 null
        requestId:
          type: string
          example: req_8f3a1b2c
        timestamp:
          type: string
          format: date-time
          description: ISO 8601 时间戳，与业务字段时间格式保持一致
          example: "2026-08-10T12:00:00Z"
      required: [code, message, requestId, timestamp]
    Pagination:
      type: object
      properties:
        page: {type: integer}
        pageSize: {type: integer}
        total: {type: integer}
        totalPages: {type: integer}
      required: [page, pageSize, total, totalPages]
    ArticlePage:
      type: object
      description: 文章分页结果，list 项为 ArticleSummary（不含 content 全文）
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/ArticleSummary'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required: [list, pagination]
    UserPage:
      type: object
      description: 用户分页结果
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/User'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required: [list, pagination]
    CommentPage:
      type: object
      description: 评论分页结果（楼中楼平面展开，由 parentId 关联）
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/Comment'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required: [list, pagination]
    AttachmentPage:
      type: object
      description: 附件分页结果
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/Attachment'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required: [list, pagination]
    User:
      type: object
      description: 用户对象；密码哈希绝不出现在此结构中
      properties:
        id: {type: integer}
        username: {type: string, maxLength: 32}
        email:
          type: string
          format: email
          maxLength: 255
          description: 邮箱，唯一。仅本人（/me/profile）与 admin（/users）可见，公开端点不返回
        nickname: {type: string, maxLength: 32}
        avatar: {type: string, nullable: true, format: uri, maxLength: 512}
        role:
          type: string
          enum: [admin, editor, member]
          description: 三角色：member=普通会员（仅阅读/评论）；editor=内容编辑，管理全站文章/评论/分类/标签，但不可管理用户/角色/站点配置；admin=后台管理员（含用户/角色/站点配置）
        status:
          type: string
          enum: [active, disabled]
          description: disabled 账号无法登录与刷新（401 / code 1005），其公开主页返回 404
        level:
          type: integer
          default: 1
          description: 会员等级，仅展示用，无业务功能；默认 1，仅 admin 可改（见 PATCH /users/{id}）
        createdAt: {type: string, format: date-time}
      required: [id, username, nickname, role, status]
    MemberProfile:
      type: object
      description: 会员公开主页数据（不含 email 等隐私字段）
      properties:
        id: {type: integer}
        nickname: {type: string, maxLength: 32}
        avatar: {type: string, nullable: true, format: uri, maxLength: 512}
        level: {type: integer}
        articleCount: {type: integer}
        articles:
          type: array
          description: 该会员的 published 文章列表（不含 content 全文）
          items:
            $ref: '#/components/schemas/ArticleSummary'
      required: [id, nickname, level, articleCount]
    Article:
      type: object
      description: 文章完整对象（含 content 全文，仅详情/管理接口返回）
      properties:
        id: {type: integer}
        title: {type: string, maxLength: 200}
        slug:
          type: string
          nullable: true
          pattern: "^[a-z0-9-]{1,64}$"
          maxLength: 64
          description: URL 别名，可选；留空时前台用 id 路由。仅管理员手动填且需唯一
        summary: {type: string, nullable: true, maxLength: 500}
        content: {type: string, maxLength: 65535}
        coverImage: {type: string, format: uri, maxLength: 512, nullable: true}
        authorId: {type: integer}
        authorName: {type: string, maxLength: 64}
        categoryId: {type: integer, nullable: true}
        categoryName: {type: string, maxLength: 64, nullable: true}
        tags:
          type: array
          items: {type: string}
        status:
          type: string
          enum: [draft, pending, published]
          x-allowed-transitions:
            - {from: draft, to: pending}
            - {from: draft, to: published}
            - {from: pending, to: published}
            - {from: pending, to: draft}
            - {from: published, to: draft}
            - {from: published, to: pending}
        viewCount: {type: integer}
        likeCount: {type: integer, description: 文章总赞数}
        publishedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      required: [id, title, content, authorId, status]
    ArticleSummary:
      type: object
      description: 文章摘要（列表/收藏/会员主页复用，不含 content 全文）
      properties:
        id: {type: integer}
        title: {type: string, maxLength: 200}
        slug:
          type: string
          nullable: true
          pattern: "^[a-z0-9-]{1,64}$"
          maxLength: 64
        summary: {type: string, nullable: true, maxLength: 500}
        coverImage: {type: string, format: uri, maxLength: 512, nullable: true}
        authorId: {type: integer}
        authorName: {type: string, maxLength: 64}
        categoryId: {type: integer, nullable: true}
        categoryName: {type: string, maxLength: 64, nullable: true}
        tags:
          type: array
          items: {type: string}
        status:
          type: string
          enum: [draft, pending, published]
        viewCount: {type: integer}
        likeCount: {type: integer, description: 文章总赞数}
        publishedAt: {type: string, format: date-time, nullable: true}
        createdAt: {type: string, format: date-time}
        updatedAt: {type: string, format: date-time}
      required: [id, title, authorId, status]
    Category:
      type: object
      description: 分类实体。无限级自关联树，最大嵌套深度 4 级（见 x-max-depth）；建树或变更 parentId 超出深度时后端拒绝
      x-max-depth: 4
      properties:
        id: {type: integer}
        name: {type: string, maxLength: 50}
        slug: {type: string, pattern: "^[a-z0-9-]{1,64}$", maxLength: 64}
        description: {type: string, nullable: true, maxLength: 500}
        parentId: {type: integer, nullable: true}
        sortOrder: {type: integer}
      required: [id, name, slug]
    CategoryNode:
      type: object
      description: 分类树节点（递归）
      properties:
        id: {type: integer}
        name: {type: string, maxLength: 50}
        slug: {type: string, pattern: "^[a-z0-9-]{1,64}$", maxLength: 64}
        description: {type: string, nullable: true, maxLength: 500}
        sortOrder: {type: integer}
        children:
          type: array
          items:
            $ref: '#/components/schemas/CategoryNode'
    Tag:
      type: object
      properties:
        id: {type: integer}
        name: {type: string, maxLength: 50}
        slug: {type: string, pattern: "^[a-z0-9-]{1,64}$", maxLength: 64}
        articleCount: {type: integer}
      required: [id, name, slug]
    Comment:
      type: object
      properties:
        id: {type: integer}
        articleId: {type: integer}
        userId: {type: integer}
        userName: {type: string, maxLength: 64}
        parentId: {type: integer, nullable: true}
        content:
          type: string
          maxLength: 2000
          description: 展示内容，已做敏感词转星号处理
        status:
          type: string
          enum: [approved, rejected, reviewing]
          description: >
            approved=通过（转义后展示）；rejected=违规比率超阈值不予展示；reviewing=人工复核中。
            自动流只产出 approved / rejected；reviewing 仅能由 `PATCH /comments/{id}/status`（admin）置位与移出。
            公开列表 `GET /articles/{idOrSlug}/comments` 只返回 approved
        rejectedReason: {type: string, maxLength: 200, nullable: true}
        createdAt: {type: string, format: date-time}
      required: [id, articleId, userId, content, status]
    CommentModerateRequest:
      type: object
      description: 评论人工复核置位入参（admin 专用）
      properties:
        status:
          type: string
          enum: [approved, rejected, reviewing]
          description: 目标状态。置为当前同一状态时幂等返回 200
        reason:
          type: string
          nullable: true
          description: 可选，写入 rejectedReason（置为 approved 时后端清空该字段）
      required: [status]
    ReadingHistoryItem:
      type: object
      description: 阅读历史条目，文章摘要 + 阅读进度
      properties:
        article:
          $ref: '#/components/schemas/ArticleSummary'
        lastReadAt: {type: string, format: date-time}
        progress:
          type: integer
          description: 阅读进度百分比 0-100，可选
      required: [article, lastReadAt]
    HistoryPage:
      type: object
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/ReadingHistoryItem'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required: [list, pagination]
    Attachment:
      type: object
      description: >
        附件 / 上传资源。`POST /upload` 返回本结构（上传即落 Attachment 表），
        `GET /me/attachments` 列举本人上传，`DELETE /attachments/{id}` 删除。
        它不是内部影子表，而是契约对外暴露的一等实体。
      properties:
        id: {type: integer}
        userId:
          type: integer
          description: 上传者，由令牌推断，不由客户端传入
        articleId:
          type: integer
          nullable: true
          description: 可选关联的文章；由上传时的表单字段 articleId 写入（编辑器内上传场景）
        url: {type: string, format: uri, maxLength: 512}
        storage:
          type: string
          enum: [r2, local]
          description: 本次实际使用的存储后端，由 STORAGE_DRIVER 决定（见 02 §2.6）
        mimeType: {type: string, maxLength: 100}
        size:
          type: integer
          maximum: 10485760
          description: 字节数（上限 10MB，与上传约束一致）
        createdAt: {type: string, format: date-time}
      required: [id, userId, url, storage, mimeType, size]
    ValidationError:
      type: object
      description: 字段级校验错误明细
      properties:
        field: {type: string, description: 出错的字段名}
        message: {type: string, description: 错误说明}
      required: [field, message]
    ValidationErrorList:
      type: object
      description: 4001 参数校验失败的 data 结构
      properties:
        errors:
          type: array
          items:
            $ref: '#/components/schemas/ValidationError'
      required: [errors]
    LoginRequest:
      type: object
      properties:
        username: {type: string, maxLength: 32}
        password: {type: string, minLength: 8}
      required: [username, password]
    RegisterRequest:
      type: object
      description: 注册入参。注册默认角色为 member；admin 后续经 PATCH /users/{id} 晋升为 editor。
      properties:
        username: {type: string, maxLength: 32}
        email: {type: string, format: email, maxLength: 255}
        password: {type: string, minLength: 8}
        nickname: {type: string, maxLength: 32}
      required: [username, email, password]
    AuthResult:
      type: object
      description: 登录/刷新结果。refreshToken 用于浏览器 HttpOnly Cookie 与移动端安全存储两种载体
      properties:
        accessToken: {type: string}
        expiresIn:
          type: integer
          description: access token 有效期（秒）
        refreshToken:
          type: string
          description: >
            刷新令牌。浏览器端由 Set-Cookie 写入 HttpOnly+SameSite Cookie；
            移动端返回此字段存于安全存储，刷新时置于请求体。
            采用**旋转策略**：每次刷新签发新值并作废旧值（见 POST /auth/refresh）
        user:
          $ref: '#/components/schemas/User'
      required: [accessToken, expiresIn, user]
    RefreshRequest:
      type: object
      description: 刷新访问令牌。浏览器端通常无需传体（用 Cookie）；移动端将 refreshToken 置于体
      properties:
        refreshToken:
          type: string
          nullable: true
      required: []
    ArticleCreate:
      type: object
      description: 创建/更新文章入参
      properties:
        title: {type: string, maxLength: 200}
        summary: {type: string, nullable: true, maxLength: 500}
        content: {type: string, maxLength: 65535}
        coverImage: {type: string, format: uri, maxLength: 512, nullable: true}
        categoryId: {type: integer, nullable: true}
        tags:
          type: array
          items: {type: string}
        slug:
          type: string
          nullable: true
          description: >
            可选的 URL 别名。权限约束（与 status 同规格显式化）：
            **member 传入 slug 时后端一律忽略**（创建时留空、更新时保持原值），不报错也不写入；editor 与 admin 可直接指定。slug 需全局唯一（软删除行不占用，见 02 §2.2 部分唯一索引），
            重复则返回 409 / code 3002；命中预留子路径黑名单（tree/view/submit 等）返回 400 / code 4001
        status:
          type: string
          enum: [draft, pending, published]
          description: >
            目标状态。权限约束：member 传入 published 时后端忽略并降级为 pending（会员无法直接发布）；
            editor 与 admin 可直接置为 published。
      required: [title, content]
    HistoryReport:
      type: object
      description: 上报阅读进度（写入/更新 ReadingLog）
      properties:
        articleId: {type: integer}
        progress:
          type: integer
          nullable: true
          description: 阅读进度百分比 0-100，可选；不传则仅记录 lastReadAt
      required: [articleId]
    ChangePasswordRequest:
      type: object
      properties:
        oldPassword: {type: string, minLength: 8}
        newPassword: {type: string, minLength: 8}
      required: [oldPassword, newPassword]
    AdminResetPasswordRequest:
      type: object
      description: >
        admin 重置他人密码。v1 不做邮件找回（Non-goal，见 02 §九），
        此端点是「忘记密码」的唯一兜底路径，同时是「哈希不可逆但管理员仍能重置」这一权衡的教学素材
      properties:
        newPassword: {type: string, minLength: 8}
      required: [newPassword]
    ProfileUpdateRequest:
      type: object
      description: 更新本人资料。email 唯一，冲突返回 409 / code 3002
      properties:
        nickname: {type: string, maxLength: 32}
        avatar: {type: string, nullable: true, format: uri, maxLength: 512}
        email:
          type: string
          format: email
          maxLength: 255
          description: 可选。v1 无邮箱验证流程（Non-goal），改后立即生效，仅做唯一性校验
      required: []
    OAuthCallbackRequest:
      type: object
      description: 第三方登录回调入参（M3-09 扩展点）
      properties:
        code: {type: string, description: 第三方授权码}
        state: {type: string, nullable: true}
        redirectUri: {type: string, format: uri, maxLength: 512, nullable: true}
      required: [code]
    SiteSetting:
      type: object
      description: 站点基础配置（站点名称/标题/描述/关键词/Logo/版权）。单条记录，由 admin 经 PATCH /admin/site/settings 维护；前台经 GET /site/settings 读取用于页头/页脚/SEO。
      properties:
        id: {type: integer}
        siteName: {type: string, maxLength: 100, description: 站点名称（品牌短名，用于页头、Logo alt、文章页标题拼接）}
        siteTitle: {type: string, nullable: true, maxLength: 200, description: "站点标题（浏览器标签/SEO `<title>` 主页默认标题；文章详情页由前端拼接为「{文章标题} · {siteName}」）"}
        siteDescription: {type: string, maxLength: 500, description: 站点描述（SEO meta description / 页脚简介）}
        siteKeywords: {type: string, nullable: true, maxLength: 200, description: "站点关键词（meta keywords，逗号分隔，如「全栈,前端,React」）"}
        logoUrl: {type: string, nullable: true, format: uri, maxLength: 512, description: Logo 图片地址（经上传端点获得）}
        copyright: {type: string, nullable: true, maxLength: 200, description: 版权信息（页脚展示，如「© 2026 成为全栈开发工程师」）}
        updatedAt: {type: string, format: date-time}
      required: [id, siteName, siteDescription]
    SiteSettingUpdate:
      type: object
      description: 站点配置更新入参，字段均可选（仅传需变更项）。
      properties:
        siteName: {type: string, maxLength: 100}
        siteTitle: {type: string, nullable: true, maxLength: 200}
        siteDescription: {type: string, maxLength: 500}
        siteKeywords: {type: string, nullable: true, maxLength: 200}
        logoUrl: {type: string, nullable: true, maxLength: 512}
        copyright: {type: string, nullable: true, maxLength: 200}
      required: []
    ArticleStub:
      type: object
      description: 文章精简投影，用于上一篇/下一篇、相关文章等导航场景（不含 content 全文）
      properties:
        id: {type: integer}
        title: {type: string, maxLength: 200}
        slug:
          type: string
          nullable: true
      required: [id, title]
    ArticleAdjacent:
      type: object
      description: 当前文章在同排序（-publishedAt）下的相邻两篇，仅 published 文章参与
      properties:
        prev:
          $ref: '#/components/schemas/ArticleStub'
          nullable: true
          description: 更早发布的文章；无则 null
        next:
          $ref: '#/components/schemas/ArticleStub'
          nullable: true
          description: 更晚发布的文章；无则 null
      required: [prev, next]
    CategoryBreadcrumbItem:
      type: object
      description: 面包屑路径单项（从根到当前分类）
      properties:
        id: {type: integer}
        name: {type: string, maxLength: 50}
        slug: {type: string, pattern: "^[a-z0-9-]{1,64}$", maxLength: 64}
      required: [id, name, slug]
    ArticleRelatedItem:
      type: object
      description: 相关文章精简投影，基于共享标签 + 同分类打分，排除自身，仅 published
      properties:
        id: {type: integer}
        title: {type: string, maxLength: 200}
        slug:
          type: string
          nullable: true
        viewCount: {type: integer}
      required: [id, title]
    SiteStats:
      type: object
      description: 站点级聚合统计，供页脚/后台概览；计数均为有效口径（published 文章、approved 评论、active 会员）
      properties:
        articleCount: {type: integer, description: 已发布文章数}
        commentCount: {type: integer, description: 已通过评论数}
        memberCount: {type: integer, description: 活跃会员数}
        viewTotal: {type: integer, description: 全站阅读量累计}
      required: [articleCount, commentCount, memberCount, viewTotal]
    CategoryStat:
      type: object
      description: 分类文章数统计项
      properties:
        id: {type: integer}
        name: {type: string, maxLength: 50}
        slug: {type: string, pattern: "^[a-z0-9-]{1,64}$", maxLength: 64}
        articleCount: {type: integer, description: 该分类下 published 文章数}
      required: [id, name, slug, articleCount]
    TocItem:
      type: object
      description: 文章目录项，由正文 Markdown 标题解析生成
      properties:
        level: {type: integer, description: 标题层级 1-6}
        text: {type: string, maxLength: 200, description: 标题文本}
        anchor: {type: string, maxLength: 100, description: 锚点 id（slug 化标题）}
      required: [level, text, anchor]
    MemberPage:
      type: object
      description: 会员公开资料分页结果（用于搜索会员）
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/MemberProfile'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required: [list, pagination]
    SearchResult:
      type: object
      description: 搜索结果。type=article 时填充 articles，type=member 时填充 members，其余为 null
      properties:
        articles:
          $ref: '#/components/schemas/ArticlePage'
          nullable: true
        members:
          $ref: '#/components/schemas/MemberPage'
          nullable: true
      required: []
    LikeStatus:
      type: object
      description: 点赞状态，返回当前用户对该文章的点赞态与总赞数
      properties:
        liked: {type: boolean, description: 当前用户是否已赞（匿名恒为 false）}
        likeCount: {type: integer, description: 文章总赞数}
      required: [liked, likeCount]
    Notification:
      type: object
      description: 通知实体。由系统事件（评论审核通过、文章发布等）服务端生成，客户端不可直接创建
      properties:
        id: {type: integer}
        userId: {type: integer, description: 通知接收者（所属用户 id），由系统事件服务端写入}
        type: {type: string, enum: [article_published, comment_approved, system], description: 通知类型}
        title: {type: string, maxLength: 200}
        body: {type: string, maxLength: 2000, nullable: true}
        link: {type: string, nullable: true, format: uri, maxLength: 512, description: "跳转链接（如 /articles/{id}）"}
        isRead: {type: boolean}
        createdAt: {type: string, format: date-time}
      required: [id, type, title, isRead, createdAt]
    NotificationPage:
      type: object
      description: 通知分页结果
      properties:
        list:
          type: array
          items:
            $ref: '#/components/schemas/Notification'
        pagination:
          $ref: '#/components/schemas/Pagination'
      required: [list, pagination]
    ErrorCode:
      type: integer
      description: 业务错误码。0 表示成功；>0 见错误码表（1xxx 认证 / 2xxx 授权 / 3xxx 资源 / 4xxx 参数 /
        5xxx 服务）。
      enum:
        - 0
        - 1001
        - 1002
        - 1003
        - 1004
        - 1005
        - 2001
        - 3001
        - 3002
        - 3003
        - 4001
        - 5000
        - 5001
security:
  - bearerAuth: []
paths:
  /api/v1/auth/register:
    post:
      operationId: registerUser
      tags: [Auth]
      summary: 注册
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: 注册成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AuthResult'
        '400':
          description: 参数校验失败（code 4001，data 含字段级 errors 明细）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ValidationErrorList'
              example:
                code: 4001
                message: 参数校验失败
                data:
                  errors:
                    - field: email
                      message: 邮箱格式不正确
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
        '409':
          description: 用户名或邮箱已被占用（code 3002）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 3002
                message: 资源冲突（唯一约束或引用占用）
                data:
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
  /api/v1/auth/login:
    post:
      operationId: login
      tags: [Auth]
      summary: 登录
      description: 账号 status=disabled 时拒绝登录，返回 401 / code 1005（不返回 
        403，避免暴露账号存在性）
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: 登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AuthResult'
        '401':
          description: 用户名或密码错误（code 1001）；或账号已被禁用（code 1005）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                wrong_credentials:
                  summary: 用户名或密码错误
                  value:
                    code: 1001
                    message: 用户名或密码错误
                    data:
                    requestId: req_8f3a1b2c
                    timestamp: '2026-08-10T12:00:00Z'
                account_disabled:
                  summary: 账号已被禁用
                  value:
                    code: 1005
                    message: 账号已被禁用
                    data:
                    requestId: req_8f3a1b2c
                    timestamp: '2026-08-10T12:00:00Z'
  /api/v1/auth/refresh:
    post:
      operationId: refreshToken
      tags: [Auth]
      summary: 刷新访问令牌
      description: >
        浏览器端通过 HttpOnly Cookie 携带 refreshToken；移动端将 refreshToken 置于请求体。
        读取优先级：Cookie 优先，缺失取请求体，两者皆无 → 401 / code 1003。


        **旋转策略（强制）**：每次刷新成功即作废旧 refreshToken 并签发新值（响应体与 Set-Cookie 同时更新）。
        旧令牌再次使用视为重放攻击 → 401 / code 1003，并连带作废该用户的整个令牌家族（须重新登录）。
        账号 status=disabled 时刷新一律失败（401 / code 1005）。
      security: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: 刷新成功（返回全新的 accessToken 与 refreshToken）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AuthResult'
        '401':
          description: 刷新令牌失效 / 已被旋转作废 / 重放（code 1003）；令牌缺失（code 1004）或无效（code 
            1002）；或账号已被禁用（code 1005）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              examples:
                refresh_invalid:
                  summary: 刷新令牌失效 / 已被旋转作废 / 重放
                  value:
                    code: 1003
                    message: 刷新令牌失效，请重新登录
                    data:
                    requestId: req_8f3a1b2c
                    timestamp: '2026-08-10T12:00:00Z'
                token_missing:
                  summary: 令牌缺失
                  value:
                    code: 1004
                    message: 缺少刷新令牌
                    data:
                    requestId: req_8f3a1b2c
                    timestamp: '2026-08-10T12:00:00Z'
                token_invalid:
                  summary: 令牌无效
                  value:
                    code: 1002
                    message: 令牌无效
                    data:
                    requestId: req_8f3a1b2c
                    timestamp: '2026-08-10T12:00:00Z'
                account_disabled:
                  summary: 账号已被禁用
                  value:
                    code: 1005
                    message: 账号已被禁用
                    data:
                    requestId: req_8f3a1b2c
                    timestamp: '2026-08-10T12:00:00Z'
  /api/v1/auth/logout:
    post:
      operationId: logout
      x-authz:
        minRole: member
      tags: [Auth]
      summary: 登出，作废刷新令牌
      description: >
        登出闭环：浏览器端须清除 refreshToken Cookie（示例响应头
        `Set-Cookie: refreshToken=; HttpOnly; SameSite=None; Secure; Max-Age=0`）；
        移动端清除本地安全存储的 refreshToken。服务端同时作废该令牌家族。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 登出成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
  /api/v1/auth/me:
    get:
      operationId: getCurrentUser
      x-authz:
        minRole: member
      tags: [Auth]
      summary: 当前登录用户
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/User'
  /api/v1/auth/{provider}/callback:
    post:
      operationId: oauthCallback
      tags: [Auth]
      summary: 第三方登录回调（扩展点，M3-09）
      description: >
        第三方登录（微信/微博等）授权回调入口，将第三方身份归并到统一 User 体系。
        新用户按 provider+openid 自动建号（默认角色 member），已存在则直接登录。
        此为扩展端点：第一波 Node 后端可先返回 501 Not Implemented，M3-09 统一讲解设计模式与对接，
        但契约预留，保证前后端不漂移。
      security: []
      parameters:
        - name: provider
          in: path
          required: true
          schema:
            type: string
            enum: [wechat, weibo, github]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OAuthCallbackRequest'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: 绑定/登录成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/AuthResult'
        '500':
          description: 该第三方登录尚未实现（扩展点占位，内部错误口径）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 5000
                message: 服务器内部错误
                data:
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
  /api/v1/articles:
    get:
      operationId: listArticles
      tags: [Article]
      summary: 公开文章列表（仅 published）
      description: >
        公开列表，强制只返回 status=published 的文章；`?status=` 参数在本端点被忽略（避免草稿/待审泄露）。
        后台管理所需的 draft/pending 筛选由鉴权端点 `GET /admin/articles` 提供，
        「我自己的全部文章」由 `GET /me/articles` 提供。


        作者账号被禁用（status=disabled）**不影响**其已发布文章的公开可见性——内容下架走文章状态机
        `POST /admin/articles/{id}/status`，与账号状态解耦（见 02 §三）。
      security: []
      parameters:
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
        - $ref: '#/components/parameters/Sort'
        - $ref: '#/components/parameters/FilterCategory'
        - $ref: '#/components/parameters/FilterTag'
        - $ref: '#/components/parameters/FilterKeyword'
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: 成功（仅 published）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ArticlePage'
    post:
      operationId: createArticle
      x-authz:
        minRole: member
      tags: [Article]
      summary: 创建文章
      description: 会员创建默认 draft/pending；admin 可 published。slug 仅 admin 可指定。详见 02
        文档 §2.3
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleCreate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 创建成功
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Article'
        '400':
          description: 参数校验失败（code 4001，data 含字段级 errors 明细；含 slug 命中预留路径黑名单）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/ValidationErrorList'
              example:
                code: 4001
                message: 参数校验失败
                data:
                  errors:
                    - field: email
                      message: 邮箱格式不正确
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
        '409':
          description: slug 已被未删除文章占用（code 3002）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 3002
                message: 资源冲突（唯一约束或引用占用）
                data:
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
  /api/v1/articles/{idOrSlug}:
    get:
      operationId: getArticle
      tags: [Article]
      summary: 文章详情（id 或 slug 均可解析）
      description: >
        **可选鉴权**：匿名可访问；携带 Bearer 时按登录身份放宽可见性。
        未发布文章（draft/pending）对匿名用户返回 404；仅作者本人与 admin 可见未发布详情。
        公开内容可见性铁律见 02 文档 §三。
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: idOrSlug
          in: path
          required: true
          schema: {type: string}
      responses:
        '429':
          $ref: '#/components/responses/RateLimited'
        '200':
          description: 成功（仅 published，或未发布的作者/管理员本人）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/Article'
        '404':
          description: 不存在，或匿名访问未发布文章
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 3001
                message: 资源不存在
                data:
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
  /api/v1/articles/{id}:
    put:
      operationId: updateArticle
      x-authz:
        minRole: editor
        ownerOverride:
          param: id
          ownerField: authorId
      tags: [Article]
      summary: 更新文章
      description: >
        作者本人，或 editor / admin。**状态副作用（显式定义，避免两实现分歧）**：
        member 编辑自己已 published 的文章，保存后状态自动退回 `pending` 需重新审核；
        editor 与 admin 编辑不改变状态。slug 权限同创建（member 传入被忽略；editor/admin 可直接指定）。
      parameters:
        - name: id
          in: path
          required: true
          schema: {type: integer}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ArticleCreate'
      responses:
        '401':
          $ref: '#/components/responses/Unauthorized'
        '200':
          description: 成功
          content:
            application/json:
              schema:
