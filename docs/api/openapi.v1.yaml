      summary: 发表评论（自动敏感词过滤）
      description: >
        命中转等长星号；违规比率超阈值则 rejected，否则 approved（自动流不产生 reviewing）。
        返回体即本条评论的判定结果：若为 rejected，前端应就地提示且**不要插入列表**
        （该条不会出现在后续 GET 列表中，属预期，见 02 §2.5）。详见 02 文档 §2.5
