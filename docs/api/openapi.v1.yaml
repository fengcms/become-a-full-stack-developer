      description: >
        **只返回 status=approved 的评论**——对任何调用者（匿名、评论作者本人、文章作者、admin）都一样。
        `reviewing` / `rejected` 不出现在本列表，管理视图请用 `GET /admin/comments`。
        这条规则显式化是为了防止 Node 与 Go 各自理解（原契约在此沉默）。


        **可选鉴权**：未发布文章对匿名返回 404；仅文章作者本人与 admin 可读取未发布文章的评论列表。
      security:
        - {}
        - bearerAuth: []
      parameters:
        - name: idOrSlug
          in: path
          required: true
          schema: {type: string}
        - $ref: '#/components/parameters/Page'
        - $ref: '#/components/parameters/PageSize'
      responses:
        '200':
          description: 成功（仅 approved）
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/ApiResponse'
                  - properties:
                      data:
                        $ref: '#/components/schemas/CommentPage'
        '404':
          description: 文章不存在（或未发布且匿名访问）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 3001
                message: 资源不存在
                data:
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
    post:
      operationId: createComment
      tags: [Comment]
      summary: 发表评论（自动敏感词过滤）
      description: >
        命中转等长星号；违规比率超阈值则 rejected，否则 approved（自动流不产生 reviewing）。
        返回体即本条评论的判定结果：若为 rejected，前端应就地提示且**不要插入列表**
        （该条不会出现在后续 GET 列表中，属预期，见 02 §2.5）。详见 02 文档 §2.5
      parameters:
        - name: idOrSlug
          in: path
          required: true
          schema: {type: string}
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
