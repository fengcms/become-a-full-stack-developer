        `Set-Cookie: refreshToken=; HttpOnly; SameSite=None; Secure; Max-Age=0`）；
        移动端清除本地安全存储的 refreshToken。服务端同时作废该令牌家族。
      requestBody:
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
