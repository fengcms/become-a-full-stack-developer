              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 2001
                message: 无权限执行该操作
                data:
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
        '404':
          description: 文章不存在或未发布（不可对未发布文章评论）
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse'
              example:
                code: 3001
                message: 资源不存在
                data:
                requestId: req_8f3a1b2c
                timestamp: '2026-08-10T12:00:00Z'
