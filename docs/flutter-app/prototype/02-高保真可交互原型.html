<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Flutter APP · 高保真可交互原型（步骤三）</title>
<style>
/* ================================================================
   令牌：与 docs/flutter-app/06-UI设计规范与设计令牌.md 一一对应
   浅色继承网站 A 方案（纯白／晴蓝）；深色为 APP 新增独立设计
   ================================================================ */
:root{
  --s1:4px; --s2:8px; --s3:12px; --s4:16px; --s5:20px; --s6:24px; --s8:32px; --s10:40px;
  --r-xs:4px; --r-sm:6px; --r-md:8px; --r-lg:12px; --r-full:999px;
  --font-cn:"PingFang SC","Noto Sans SC",-apple-system,BlinkMacSystemFont,"Microsoft YaHei",sans-serif;
  --font-mono:"SFMono-Regular",Consolas,"Roboto Mono",monospace;
}
html[data-theme="light"]{
  --bg:#FFFFFF; --bg-subtle:#F7FAFD; --surface:#FFFFFF; --surface-sunken:#F5F9FC;
  --surface-elevated:#FFFFFF; --line:#E9EFF5; --line-strong:#D5E2ED; --field-border:#8397AB;
  --text-title:#2F4256; --text-body:#34465A; --text-muted:#607286;
  --text-placeholder:#8A99A8; --text-inverse:#FFFFFF;
  --brand:#3277B5; --brand-hover:#245D91; --brand-solid:#3277B5;
  --brand-subtle:#EDF5FC; --brand-on-subtle:#2A6AA3; --focus-ring:#3277B5;
  --success:#276954; --success-bg:#EDF7F2;
  --warning:#7A6122; --warning-bg:#FAF5E9;
  --danger:#9E3D3D;  --danger-bg:#FCF1F1;
  --st-pub:#3277B5; --st-pub-bg:#EDF5FC;
  --st-pen:#7A6122; --st-pen-bg:#FAF5E9;
  --st-drf:#5C6C80; --st-drf-bg:#F0F3F6;
  --st-rej:#9E3D3D; --st-rej-bg:#FCF1F1;
  --hero-wash:linear-gradient(115deg,#F0F7FE,#E4F0FB);
  --hero-ink:#2F4256; --hero-sub:#617D96;
  --code-bg:#F7FAFD; --code-fg:#3E627F;
  --k:#8B5CF6; --s:#0F766E;
  --skeleton:#EDF3F8; --skeleton-2:#E2EBF3;
  --scrim:rgba(18,24,32,.45);
  --shadow-card:0 1px 3px rgba(41,78,117,.06);
  --shadow-overlay:0 8px 24px rgba(41,78,117,.12);
  --shadow-sheet:0 -2px 16px rgba(41,78,117,.10);
  --doc-bg:#EEF1F5; --doc-fg:#2F4256; --doc-muted:#607286;
  --doc-panel:#FFFFFF; --doc-line:#E3E9EF;
}
html[data-theme="dark"]{
  --bg:#121820; --bg-subtle:#171E27; --surface:#1A222C; --surface-sunken:#161C24;
  --surface-elevated:#212B36; --line:#2E3A46; --line-strong:#3A4754; --field-border:#4A5A69;
  --text-title:#E8EFF6; --text-body:#C6D2DE; --text-muted:#8FA0B2;
  --text-placeholder:#6E7E8F; --text-inverse:#FFFFFF;
  --brand:#5EA0D8; --brand-hover:#7FB6E4; --brand-solid:#37709F;
  --brand-subtle:#1C2E3E; --brand-on-subtle:#7FB6E4; --focus-ring:#5EA0D8;
  --success:#7FCBA8; --success-bg:#17281F;
  --warning:#E0BC72; --warning-bg:#2E2718;
  --danger:#EF9A9A;  --danger-bg:#2F1D1D;
  --st-pub:#7FB6E4; --st-pub-bg:#1C2E3E;
  --st-pen:#E0BC72; --st-pen-bg:#2E2718;
  --st-drf:#93A4B6; --st-drf-bg:#232B34;
  --st-rej:#EF9A9A; --st-rej-bg:#2F1D1D;
  --hero-wash:linear-gradient(115deg,#1B2733,#16202A);
  --hero-ink:#E8EFF6; --hero-sub:#9DB0C2;
  --code-bg:#161C24; --code-fg:#9CC4E4;
  --k:#C4A0F5; --s:#6FCFB4;
  --skeleton:#212B36; --skeleton-2:#2A3540;
  --scrim:rgba(0,0,0,.6);
  --shadow-card:0 0 0 1px var(--line-strong);
  --shadow-overlay:0 8px 24px rgba(0,0,0,.45);
  --shadow-sheet:0 -2px 16px rgba(0,0,0,.4);
  --doc-bg:#0C1116; --doc-fg:#E8EFF6; --doc-muted:#8FA0B2;
  --doc-panel:#161D26; --doc-line:#2E3A46;
}
*{box-sizing:border-box; margin:0; padding:0;}
body{
  font-family:var(--font-cn); background:var(--doc-bg); color:var(--doc-fg);
  min-height:100vh; padding:var(--s5) var(--s6) 48px; -webkit-font-smoothing:antialiased;
  transition:background .2s;
}
svg.i{width:1em; height:1em; fill:none; stroke:currentColor; stroke-width:1.6;
  stroke-linecap:round; stroke-linejoin:round; display:block; flex:0 0 auto;}
button{font-family:inherit;}

/* ================= 展示壳 ================= */
.topbar{max-width:1500px; margin:0 auto var(--s5); display:flex; align-items:center;
  justify-content:space-between; gap:var(--s4); flex-wrap:wrap;}
.topbar h1{font-size:17px; font-weight:600; color:var(--doc-fg);}
.topbar .sub{font-size:12px; color:var(--doc-muted); margin-top:5px; line-height:1.6;}
.tools{display:flex; align-items:center; gap:var(--s3); flex-wrap:wrap;}
.tool-group{display:flex; align-items:center; gap:var(--s2);}
.tool-group>label{font-size:11px; color:var(--doc-muted); white-space:nowrap;}
.seg{display:flex; background:var(--doc-panel); border:1px solid var(--doc-line);
  border-radius:var(--r-sm); overflow:hidden;}
.seg button{border:0; background:none; color:var(--doc-muted); font-size:12px;
  padding:6px 12px; cursor:pointer; min-height:32px; white-space:nowrap;}
.seg button[aria-pressed="true"]{background:var(--brand-subtle); color:var(--brand-on-subtle); font-weight:500;}

.layout{max-width:1500px; margin:0 auto; display:flex; gap:var(--s6); align-items:flex-start;
  justify-content:center;}
/* 左侧导航树 */
.navtree{width:250px; flex:0 0 250px; background:var(--doc-panel); border:1px solid var(--doc-line);
  border-radius:var(--r-lg); padding:var(--s4); max-height:calc(100vh - 130px); overflow-y:auto;}
.navtree h2{font-size:11px; text-transform:uppercase; letter-spacing:.07em; color:var(--doc-muted);
  margin:var(--s4) 0 var(--s2); font-weight:600;}
.navtree h2:first-child{margin-top:0;}
.navtree a{display:flex; align-items:center; gap:var(--s2); padding:6px 8px; border-radius:var(--r-sm);
  font-size:12.5px; color:var(--doc-fg); text-decoration:none; line-height:1.4; min-width:0;}
.navtree a:hover{background:var(--bg-subtle);}
.navtree a.on{background:var(--brand-subtle); color:var(--brand-on-subtle); font-weight:600;}
.navtree a code{font-family:var(--font-mono); font-size:10px; color:var(--doc-muted); margin-left:auto;
  opacity:.8; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; max-width:104px; min-width:0;}
.navtree a.on code{color:var(--brand-on-subtle); opacity:1;}

/* 中间设备 */
.device-wrap{display:flex; flex-direction:column; align-items:center; gap:var(--s2);}
.caption{font-size:11.5px; color:var(--doc-muted); text-align:center; line-height:1.6;}
.device{width:393px; height:852px; border-radius:26px; background:var(--bg);
  border:1px solid var(--line); overflow:hidden; display:flex; flex-direction:column;
  box-shadow:var(--shadow-overlay); position:relative; transition:background .2s;}
.statusbar{height:32px; flex:0 0 auto; display:flex; align-items:center; justify-content:space-between;
  padding:0 20px; font-size:12px; font-weight:600; color:var(--text-title); background:var(--surface);}
.sb-r{display:flex; align-items:center; gap:5px;}
.sb-bars{display:flex; align-items:flex-end; gap:2px; height:10px;}
.sb-bars i{width:3px; background:currentColor; border-radius:1px; display:block;}
.sb-bars i:nth-child(1){height:4px;} .sb-bars i:nth-child(2){height:6px;}
.sb-bars i:nth-child(3){height:8px;} .sb-bars i:nth-child(4){height:10px;}
.sb-batt{width:22px; height:11px; border:1.4px solid currentColor; border-radius:3px; position:relative;}
.sb-batt::after{content:""; position:absolute; right:-3.5px; top:3px; width:2px; height:5px;
  background:currentColor; border-radius:0 1px 1px 0;}
.sb-batt i{position:absolute; inset:1.6px; width:70%; background:currentColor; border-radius:1.5px; display:block;}

/* 顶部栏 */
.appbar{flex:0 0 auto; min-height:52px; display:flex; align-items:center; gap:var(--s2);
  padding:0 var(--s4); background:var(--surface); border-bottom:1px solid var(--line);}
.appbar .brand{display:flex; align-items:center; gap:var(--s2); font-weight:700; font-size:16px;
  color:var(--text-title); letter-spacing:-.3px;}
.brand-mark{background:var(--brand-subtle); color:var(--brand-on-subtle); font-family:var(--font-mono);
  font-size:15px; font-weight:700; padding:3px 7px; border-radius:var(--r-xs); line-height:1.2;}
.appbar .grow{flex:1;}
.appbar-title{font-size:15px; font-weight:600; color:var(--text-title); flex:1; min-width:0;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;}
.iconbtn{width:44px; height:44px; display:grid; place-items:center; border:0; background:none;
  color:var(--text-body); cursor:pointer; font-size:20px; border-radius:var(--r-full); position:relative;}
.iconbtn:hover{background:var(--bg-subtle);}
.iconbtn:active{background:var(--brand-subtle);}
.iconbtn.edge{margin-left:-10px;} .iconbtn.edge-r{margin-right:-10px;}
.badge-dot{position:absolute; top:9px; right:9px; min-width:15px; height:15px; border-radius:8px;
  background:var(--danger); color:#fff; font-size:9px; font-weight:600; display:grid;
  place-items:center; padding:0 4px; border:1.5px solid var(--surface);}

/* 内容区 */
.screen{flex:1; overflow-y:auto; overflow-x:hidden; background:var(--bg); scrollbar-width:none;
  scroll-behavior:auto; position:relative;}
.screen::-webkit-scrollbar{display:none;}
.fade{animation:fade .18s ease-out;}
@keyframes fade{from{opacity:0; transform:translateY(4px);} to{opacity:1; transform:none;}}
@media (prefers-reduced-motion:reduce){ .fade{animation:none;} }

/* 底部 Tab */
.tabbar{flex:0 0 auto; height:56px; display:flex; background:var(--surface); border-top:1px solid var(--line);}
.tabbar button{flex:1; border:0; background:none; cursor:pointer; color:var(--text-muted);
  display:flex; flex-direction:column; align-items:center; justify-content:center; gap:3px;
  font-size:10px; position:relative; min-height:56px;}
.tabbar button svg.i{font-size:22px;}
.tabbar button.on{color:var(--brand); font-weight:600;}
.tab-dot{position:absolute; top:9px; left:calc(50% + 7px); width:7px; height:7px; border-radius:50%;
  background:var(--danger);}

/* ================= 通用页面元素 ================= */
.px{padding-left:var(--s4); padding-right:var(--s4);}
.sec-head{display:flex; align-items:center; justify-content:space-between; gap:var(--s3);
  margin:var(--s6) var(--s4) 0; padding-bottom:var(--s3); border-bottom:1px solid var(--line);}
.sec-head h3{font-size:17px; font-weight:600; color:var(--text-title);}
.sec-head .more{font-size:12px; color:var(--brand); text-decoration:none; display:flex;
  align-items:center; gap:2px; background:none; border:0; cursor:pointer; min-height:24px;}
.sec-head .more svg.i{font-size:14px;}
.page-title{padding:var(--s5) var(--s4) var(--s2);}
.page-title h1{font-size:24px; font-weight:700; color:var(--text-title); line-height:1.35;}
.page-title p{font-size:12.5px; color:var(--text-muted); margin-top:6px; line-height:1.65;}

/* 文章列表项 */
.entry{display:flex; gap:var(--s3); padding:var(--s4); border-bottom:1px solid var(--line);
  align-items:flex-start; cursor:pointer; background:none; border-left:0; border-right:0;
  border-top:0; width:100%; text-align:left;}
.entry:hover{background:var(--bg-subtle);}
.entry:active{background:var(--brand-subtle);}
.entry .eb{flex:1; min-width:0;}
.entry h4{font-size:16px; line-height:1.5; font-weight:600; color:var(--text-title); margin-bottom:6px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.entry .sum{font-size:12.5px; line-height:1.65; color:var(--text-muted); margin-bottom:8px;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.entry .meta{font-size:11px; color:var(--text-muted); display:flex; align-items:center; gap:8px; flex-wrap:wrap;}
.entry .meta i{width:2px; height:2px; border-radius:50%; background:currentColor; opacity:.6; display:block;}
.thumb{width:96px; height:72px; flex:0 0 96px; border-radius:var(--r-xs); background:var(--brand-subtle);
  color:var(--brand-on-subtle); display:grid; place-items:center; font-family:var(--font-mono);
  font-size:14px; font-weight:600; border:1px solid var(--line);}
.entry.noimg .thumb{display:none;}

/* 徽章 */
.chip{display:inline-flex; align-items:center; gap:4px; font-size:11px; font-weight:500;
  padding:3px 8px; border-radius:var(--r-xs); white-space:nowrap;}
.chip svg.i{font-size:12px;}
.chip.pub{background:var(--st-pub-bg); color:var(--st-pub);}
.chip.pen{background:var(--st-pen-bg); color:var(--st-pen);}
.chip.drf{background:var(--st-drf-bg); color:var(--st-drf);}
.chip.rej{background:var(--st-rej-bg); color:var(--st-rej);}
.chip.tagp{background:var(--brand-subtle); color:var(--brand-on-subtle); border-radius:var(--r-full);}

/* 按钮 */
.b{display:inline-flex; align-items:center; justify-content:center; gap:6px; font-size:14px;
  font-weight:500; border-radius:var(--r-md); min-height:44px; padding:0 var(--s5);
  border:1px solid transparent; cursor:pointer; text-decoration:none;}
.b svg.i{font-size:17px;}
.b.pri{background:var(--brand-solid); color:#fff;}
.b.pri:active{background:var(--brand-hover);}
.b.sec{background:var(--surface); border-color:var(--line-strong); color:var(--brand);}
.b.sec:active{background:var(--brand-subtle);}
.b.txt{background:none; color:var(--brand); padding:0 var(--s2);}
.b.dgr{background:var(--danger); color:#fff;}
.b.wide{width:100%;}
.b:disabled{opacity:.55; cursor:default;}

/* 表单 */
.field{display:block; margin-bottom:var(--s4);}
.field .lb{font-size:13px; font-weight:500; color:var(--text-body); margin-bottom:7px; display:block;}
.field .lb .req{color:var(--danger); margin-left:2px;}
.inp{width:100%; border:1px solid var(--field-border); border-radius:var(--r-sm); background:var(--surface-elevated);
  color:var(--text-body); font-size:16px; padding:11px 12px; min-height:44px;}
.inp::placeholder{color:var(--text-placeholder);}
.inp:focus{outline:2px solid var(--focus-ring); outline-offset:1px; border-color:var(--brand);}
.inp.err{border-color:var(--danger);}
textarea.inp{min-height:96px; resize:vertical; line-height:1.7;}
.field .hint{font-size:11px; color:var(--text-muted); margin-top:6px; line-height:1.6;}
.field .errtxt{font-size:11px; color:var(--danger); margin-top:6px; display:flex; align-items:center; gap:4px;}
.field .errtxt svg.i{font-size:13px;}
.counter{font-size:11px; color:var(--text-muted); text-align:right; margin-top:5px;}
.counter.warn{color:var(--warning); font-weight:500;}

/* 分段控件 */
.segs{display:flex; gap:var(--s2); overflow-x:auto; padding:var(--s3) var(--s4);
  scrollbar-width:none; border-bottom:1px solid var(--line);}
.segs::-webkit-scrollbar{display:none;}
.segs button{border:1px solid var(--line); background:var(--surface); color:var(--text-muted);
  font-size:12.5px; padding:0 14px; height:32px; border-radius:var(--r-full); cursor:pointer;
  white-space:nowrap; flex:0 0 auto;}
.segs button.on{background:var(--brand-subtle); color:var(--brand-on-subtle); border-color:var(--brand-subtle);
  font-weight:600;}

/* 卡片 */
.card{margin:var(--s4); border:1px solid var(--line); border-radius:var(--r-md); background:var(--surface);
  overflow:hidden;}
.card-pad{padding:var(--s4);}
.row{display:flex; align-items:center; gap:var(--s3); padding:var(--s4); border-bottom:1px solid var(--line);}
.row:last-child{border-bottom:0;}
.row .rt{flex:1; min-width:0; font-size:14.5px; color:var(--text-body);}
.row .rt small{display:block; font-size:11.5px; color:var(--text-muted); margin-top:4px;}
.row .rv{font-size:13px; color:var(--text-muted);}
.row.link{cursor:pointer;} .row.link:hover{background:var(--bg-subtle);}
.row svg.i.arw{font-size:15px; color:var(--text-muted);}

/* 头像 */
.avatar{border-radius:50%; background:var(--brand-subtle); color:var(--brand-on-subtle);
  display:grid; place-items:center; font-weight:600; flex:0 0 auto; width:40px; height:40px; font-size:15px;}
.avatar.sm{width:32px; height:32px; font-size:13px;}
.avatar.xs{width:26px; height:26px; font-size:11px;}
.avatar.lg{width:64px; height:64px; font-size:24px;}

/* 空态 / 错误态 / 加载 */
.state{padding:64px var(--s6); text-align:center;}
.state .ic{width:76px; height:76px; border-radius:50%; background:var(--brand-subtle); color:var(--brand-on-subtle);
  display:grid; place-items:center; margin:0 auto var(--s4); font-size:30px;}
.state h2{font-size:19px; font-weight:600; color:var(--text-title); margin-bottom:var(--s2);}
.state p{font-size:13px; color:var(--text-muted); line-height:1.7; max-width:280px; margin:0 auto var(--s5);}
.state .acts{display:flex; gap:var(--s2); justify-content:center; flex-wrap:wrap;}
.state.err .ic{background:var(--danger-bg); color:var(--danger);}
.sk{padding:var(--s4); display:flex; gap:var(--s3); border-bottom:1px solid var(--line);}
.sk .skb{flex:1;}
.skline{height:14px; border-radius:var(--r-xs); background:var(--skeleton); margin-bottom:10px;
  animation:breathe 1.2s ease-in-out infinite;}
.skline.w82{width:82%;} .skline.w45{width:45%;} .skline.w60{width:60%;} .skline.h18{height:18px;}
.skbox{width:96px; height:72px; flex:0 0 96px; border-radius:var(--r-xs); background:var(--skeleton);
  animation:breathe 1.2s ease-in-out infinite;}
@keyframes breathe{0%,100%{opacity:1;} 50%{opacity:.55;}}
@media (prefers-reduced-motion:reduce){ .skline,.skbox{animation:none;} }

/* Toast */
.toast{position:absolute; left:50%; bottom:84px; transform:translateX(-50%) translateY(8px);
  background:var(--text-title); color:var(--bg); font-size:13px; padding:10px 18px;
  border-radius:var(--r-full); opacity:0; pointer-events:none; transition:.2s; z-index:60;
  max-width:300px; text-align:center; box-shadow:var(--shadow-overlay);}
.toast.show{opacity:.96; transform:translateX(-50%) translateY(0);}
/* 遮罩与底部面板 */
.scrim{position:absolute; inset:0; background:var(--scrim); opacity:0; pointer-events:none;
  transition:.2s; z-index:40;}
.scrim.show{opacity:1; pointer-events:auto;}
.sheet{position:absolute; left:0; right:0; bottom:0; background:var(--surface);
  border-radius:var(--r-lg) var(--r-lg) 0 0; box-shadow:var(--shadow-sheet); z-index:50;
  transform:translateY(100%); transition:transform .24s cubic-bezier(.22,.61,.36,1);
  max-height:78%; display:flex; flex-direction:column;}
.sheet.show{transform:none;}
.sheet .sh{padding:var(--s4); border-bottom:1px solid var(--line); display:flex; align-items:center;
  justify-content:space-between; gap:var(--s3);}
.sheet .sh h3{font-size:16px; font-weight:600; color:var(--text-title);}
.sheet .sb{overflow-y:auto; padding:var(--s2) 0 var(--s4); scrollbar-width:none;}
.sheet .sb::-webkit-scrollbar{display:none;}
.sheet .grab{width:36px; height:4px; border-radius:2px; background:var(--line-strong); margin:10px auto 0;}
@media (prefers-reduced-motion:reduce){ .sheet{transition:none;} }

/* ================= 首页 ================= */
.hero{margin:var(--s4) var(--s4) 0; border-radius:var(--r-md); background:var(--hero-wash);
  padding:var(--s4); position:relative; overflow:hidden; cursor:pointer;}
.hero::before{content:"{ API }"; position:absolute; right:14px; top:-6px; font-family:var(--font-mono);
  font-size:46px; font-weight:600; color:var(--hero-ink); opacity:.08; pointer-events:none;}
.hero .eb{font-size:11px; font-weight:600; color:var(--brand-on-subtle); letter-spacing:.06em;
  display:block; margin-bottom:var(--s1); position:relative;}
.hero h2{font-size:22px; line-height:1.32; font-weight:700; color:var(--hero-ink); margin-bottom:var(--s2);
  position:relative; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.hero p{font-size:13px; line-height:1.62; color:var(--hero-sub); position:relative;
  display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;}
.dots{display:flex; gap:6px;}
.dots i{height:4px; width:20px; border-radius:2px; background:var(--brand); opacity:.28; display:block;}
.dots i.on{opacity:1;}
.heroctrl{display:flex; justify-content:space-between; align-items:center; padding:0 var(--s4); margin-top:var(--s2);}
.heroctrl .mid{display:flex; align-items:center; gap:var(--s3);}

  font-size:12.5px; line-height:1.6; color:var(--danger); align-items:flex-start;}
.cmtrej strong{display:block; margin-bottom:2px;}

/* 排行 */
.rank{display:flex; gap:var(--s3); padding:var(--s3) var(--s4); border-bottom:1px solid var(--line);

/* ================= 文章详情 ================= */

.art-head{padding:var(--s4);}
.art-head h1{font-size:24px; line-height:1.4; font-weight:700; color:var(--text-title); margin:var(--s3) 0 var(--s4);}
.byline{display:flex; align-items:center; gap:var(--s3); padding-bottom:var(--s4); border-bottom:1px solid var(--line);}

.byline .who small{font-size:11px; color:var(--text-muted);}
.lead{margin:var(--s4); padding:var(--s4); background:var(--surface-sunken);

  font-size:14px; line-height:1.8; color:var(--text-muted);}
.prose{padding:0 var(--s4); font-size:17px; line-height:1.85; color:var(--text-body); overflow-wrap:anywhere;}
.prose p{margin-bottom:var(--s5);}
.prose h2{font-size:20px; line-height:1.45; font-weight:600; color:var(--text-title);
  margin:var(--s8) 0 var(--s3); padding-left:10px; border-left:3px solid var(--brand);}
.prose code{font-family:var(--font-mono); font-size:.86em; background:var(--code-bg);
  border:1px solid var(--line); border-radius:3px; padding:1px 5px; color:var(--code-fg);}
.prose a{color:var(--brand); text-decoration:underline; text-underline-offset:3px;}
.codebox{margin:var(--s4) 0 var(--s5); background:var(--code-bg); border:1px solid var(--line);
  border-radius:var(--r-sm); overflow:hidden;}
.codebox .bar{display:flex; justify-content:space-between; align-items:center; padding:7px var(--s3);
  border-bottom:1px solid var(--line); font-size:11px; color:var(--text-muted); font-family:var(--font-mono);}
.codebox pre{padding:var(--s3); font-family:var(--font-mono); font-size:12.5px; line-height:1.85;
  color:var(--code-fg); overflow-x:auto; white-space:pre;}
.codebox .k{color:var(--k);} .codebox .s{color:var(--s);} .codebox .c{opacity:.6;}
.tbl-wrap{margin:var(--s4) 0 var(--s5); overflow-x:auto;}
.prose table{width:100%; min-width:340px; border-collapse:collapse; font-size:13px;}
.prose th,.prose td{border:1px solid var(--line); padding:9px 11px; text-align:left; line-height:1.6;}
.prose th{background:var(--surface-sunken); font-weight:500; color:var(--text-title);}
.prose blockquote{margin:var(--s4) 0 var(--s5); padding:var(--s3) var(--s4); background:var(--surface-sunken);
  border-left:3px solid var(--brand-subtle); border-radius:0 var(--r-sm) var(--r-sm) 0;
  color:var(--text-muted); font-size:15px;}
.toc-bar{margin:var(--s6) var(--s4) var(--s4); border:1px solid var(--line); border-radius:var(--r-md); overflow:hidden;}
.toc-bar summary{list-style:none; display:flex; align-items:center; gap:var(--s2); padding:var(--s3) var(--s4);
  font-size:13px; font-weight:500; color:var(--brand); cursor:pointer; min-height:44px;}
.toc-bar summary::-webkit-details-marker{display:none;}
.toc-bar summary .cnt{margin-left:auto; font-size:11px; color:var(--text-muted); font-weight:400;}
.toc-bar ol{padding:0 var(--s4) var(--s3); list-style:none;}
.toc-bar li{padding:8px 0; font-size:13px; color:var(--text-muted); border-top:1px solid var(--line); cursor:pointer;}
.toc-bar li.lv2{padding-left:14px;}
.toc-bar li:hover{color:var(--brand);}
.actions{display:flex; justify-content:center; gap:var(--s3); padding:var(--s5) var(--s4);
  border-top:1px solid var(--line); border-bottom:1px solid var(--line);}
.act{display:flex; flex-direction:column; align-items:center; justify-content:center; gap:5px;
  min-width:72px; min-height:56px; padding:var(--s2) var(--s3); border:1px solid var(--line);
  border-radius:var(--r-md); background:var(--surface); color:var(--text-muted); font-size:11px; cursor:pointer;}
.act svg.i{font-size:19px;}
.act.on{border-color:var(--brand); background:var(--brand-subtle); color:var(--brand-on-subtle); font-weight:600;}
.act.on svg.i{fill:currentColor; stroke:currentColor;}
.adj{padding:var(--s4); display:grid; gap:var(--s2);}
.adj button{display:block; padding:var(--s3) var(--s4); border:1px solid var(--line);
  border-radius:var(--r-md); background:none; text-align:left; color:var(--text-body);
  font-size:13.5px; line-height:1.55; cursor:pointer; font-family:inherit;}
.adj button:hover{background:var(--bg-subtle);}
.adj small{display:block; font-size:11px; color:var(--text-muted); margin-bottom:5px;}
.cmt{display:flex; gap:var(--s3); padding:var(--s4); border-bottom:1px solid var(--line);}
.cmt .cb{flex:1; min-width:0;}
.cmt .cn{font-size:13px; font-weight:600; color:var(--text-body); display:flex; align-items:center; gap:var(--s2);}
.cmt .ct{font-size:13.5px; line-height:1.75; color:var(--text-body); margin:6px 0 8px; overflow-wrap:anywhere;}
.cmt .cf{display:flex; gap:var(--s5); font-size:11px; color:var(--text-muted); align-items:center;}
.cmt .cf button{border:0; background:none; font-size:11px; color:var(--text-muted); cursor:pointer;
  padding:4px 0; min-height:28px; font-family:inherit;}
.cmt .cf button:hover{color:var(--brand);}
.reply{margin-top:var(--s3); padding:var(--s3); background:var(--surface-sunken); border-radius:var(--r-sm);}
.reply .rto{font-size:12px; color:var(--brand); font-weight:500; margin-bottom:5px;}
.reply .rq{font-size:12.5px; line-height:1.7; color:var(--text-muted); padding-left:9px;
  border-left:2px solid var(--line-strong); display:-webkit-box; -webkit-line-clamp:2;
  -webkit-box-orient:vertical; overflow:hidden;}
.reply .ra{font-size:13.5px; line-height:1.75; color:var(--text-body); margin-top:6px;}
.composer{flex:0 0 auto; display:flex; align-items:center; gap:var(--s2); padding:var(--s2) var(--s3);
  border-top:1px solid var(--line); background:var(--surface);}
.composer .fake{flex:1; height:38px; border:1px solid var(--field-border); border-radius:var(--r-full);
  display:flex; align-items:center; padding:0 var(--s4); font-size:13px; color:var(--text-placeholder);
  background:var(--bg-subtle); cursor:pointer;}
.composer .send{width:38px; height:38px; border-radius:50%; background:var(--brand-solid); color:#fff;
  border:0; display:grid; place-items:center; font-size:17px; cursor:pointer;}

/* ================= 分类 / 标签 ================= */
.ctree{padding:var(--s2) 0;}
.cnode{border-bottom:1px solid var(--line);}
.cnode>.crow{display:flex; align-items:center; gap:var(--s2); padding:var(--s4); cursor:pointer;}
.cnode>.crow:hover{background:var(--bg-subtle);}
.cnode>.crow .nm{flex:1; font-size:15px; font-weight:500; color:var(--text-body);}
.cnode>.crow .cnt{font-size:11.5px; color:var(--text-muted);}
.cnode>.crow svg.i{font-size:15px; color:var(--text-muted); transition:transform .18s;}
.cnode.open>.crow svg.i.chev{transform:rotate(90deg);}
.csub{display:none; padding-left:var(--s4); background:var(--bg-subtle);}
.cnode.open>.csub{display:block;}
.csub button{display:block; width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--line);
  padding:var(--s3) var(--s4); font-size:13.5px; color:var(--text-body); cursor:pointer; font-family:inherit;}
.csub button:hover{color:var(--brand);}
.tiles{display:grid; grid-template-columns:1fr 1fr; gap:var(--s3); padding:var(--s4);}
.tile{border:1px solid var(--line); border-radius:var(--r-md); padding:var(--s4); background:var(--surface);

.tile:hover{background:var(--bg-subtle);}
.tile strong{font-size:15px; font-weight:500; color:var(--text-body);}
.tile span{font-size:11.5px; color:var(--text-muted);}

/* ================= 搜索 ================= */
.searchbar{display:flex; gap:var(--s2); padding:var(--s3) var(--s4); border-bottom:1px solid var(--line);}
.searchbar .wrap{flex:1; display:flex; align-items:center; gap:var(--s2); border:1px solid var(--field-border);
  border-radius:var(--r-full); padding:0 var(--s3); background:var(--bg-subtle); min-height:40px;}
.searchbar .wrap svg.i{font-size:16px; color:var(--text-muted);}
.searchbar input{flex:1; border:0; background:none; font-size:15px; color:var(--text-body); outline:none; min-width:0;}
.searchbar input::placeholder{color:var(--text-placeholder);}
.hist{padding:var(--s4);}
.hist h3{font-size:13px; font-weight:600; color:var(--text-muted); margin-bottom:var(--s3);}
.hist .tags{display:flex; flex-wrap:wrap; gap:var(--s2);}
.hist .tags button{border:1px solid var(--line); background:var(--surface); color:var(--text-body);
  font-size:12.5px; padding:6px 12px; border-radius:var(--r-full); cursor:pointer; font-family:inherit;}
.hist .tags button:hover{background:var(--brand-subtle); color:var(--brand-on-subtle); border-color:var(--brand-subtle);}
mark{background:var(--brand-subtle); color:var(--brand-on-subtle); padding:0 2px; border-radius:2px;}

/* ================= 会员中心 ================= */
.identity{margin:var(--s4); border:1px solid var(--line); border-radius:var(--r-md);
  background:var(--hero-wash); padding:var(--s5); display:flex; align-items:center; gap:var(--s4);}
.identity .who{flex:1; min-width:0;}
.identity .who strong{display:block; font-size:17px; font-weight:600; color:var(--text-title);}
.identity .who small{font-size:11.5px; color:var(--text-muted); display:block; margin-top:4px;}
.grid6{display:grid; grid-template-columns:repeat(3,1fr); gap:var(--s3); padding:0 var(--s4) var(--s4);}
.grid6 button{border:1px solid var(--line); border-radius:var(--r-md); background:var(--surface);
  padding:var(--s4) var(--s2); display:flex; flex-direction:column; align-items:center; gap:var(--s2);
  cursor:pointer; position:relative; min-height:88px; justify-content:center;}
.grid6 button:hover{background:var(--bg-subtle);}
.grid6 button svg.i{font-size:22px; color:var(--brand);}
.grid6 button span{font-size:12px; color:var(--text-body);}
.grid6 button .n{position:absolute; top:8px; right:10px; font-size:10px; color:var(--text-muted);
  background:var(--bg-subtle); border-radius:var(--r-full); padding:1px 6px;}
.grid6 button .n.hot{background:var(--danger); color:#fff; font-weight:600;}
.stat-row{display:flex; padding:0 var(--s4) var(--s4); gap:var(--s3);}
.stat{flex:1; border:1px solid var(--line); border-radius:var(--r-md); padding:var(--s3);
  text-align:center; background:var(--surface);}
.stat b{display:block; font-size:18px; font-weight:700; color:var(--text-title); font-family:var(--font-mono);}
.stat span{font-size:11px; color:var(--text-muted);}

/* 通知 */
.notice{display:flex; gap:var(--s3); padding:var(--s4); border-bottom:1px solid var(--line); cursor:pointer;}
.notice:hover{background:var(--bg-subtle);}
.notice.unread{background:var(--brand-subtle);}
.notice.unread:hover{background:var(--brand-subtle);}
.notice .ni{width:36px; height:36px; flex:0 0 36px; border-radius:var(--r-md); background:var(--surface);
  color:var(--brand); display:grid; place-items:center; font-size:16px; border:1px solid var(--line);}
.notice .nb{flex:1; min-width:0;}
.notice h4{font-size:14px; font-weight:600; color:var(--text-title); display:flex;
  align-items:center; gap:var(--s2);}
.notice h4 i{width:6px; height:6px; border-radius:50%; background:var(--danger); flex:0 0 6px;}
.notice p{font-size:13px; line-height:1.7; color:var(--text-muted); margin:5px 0 6px;}
.notice time{font-size:11px; color:var(--text-muted);}

/* 编辑器 */
.editor-head{padding:var(--s4); border-bottom:1px solid var(--line);}
.editor-mode{display:flex; gap:var(--s2); padding:var(--s3) var(--s4); border-bottom:1px solid var(--line);

.editor-mode .seg{display:flex; border:1px solid var(--line-strong); border-radius:var(--r-sm); overflow:hidden;}

.editor-mode .sp{flex:1;}
.editor-mode .cnt{font-size:11px; color:var(--text-muted);}

  color:var(--text-body); background:var(--surface-elevated); resize:vertical;}
.toolbar{display:flex; gap:var(--s1); flex-wrap:wrap; padding:var(--s2) 0; border-top:1px solid var(--line); margin-top:var(--s3);}

  border-top:1px solid var(--line); background:var(--surface);}

/* 预览提示条 */
.preview-bar{background:var(--warning-bg); color:var(--warning); font-size:12px; padding:10px var(--s4);
  display:flex; align-items:center; gap:var(--s2); border-bottom:1px solid var(--line);}
.preview-bar svg.i{font-size:14px;}

/* 设置项 */
.setting{display:flex; align-items:center; gap:var(--s3); padding:var(--s4); border-bottom:1px solid var(--line);}
.setting .st{flex:1; min-width:0;}
.setting .st strong{display:block; font-size:14px; font-weight:500; color:var(--text-body);}
.setting .st small{display:block; font-size:11.5px; color:var(--text-muted); margin-top:4px; line-height:1.6;}
.switch{width:46px; height:28px; border-radius:14px; background:var(--line-strong); border:0;
  position:relative; cursor:pointer; flex:0 0 46px; transition:.18s;}
.switch::after{content:""; position:absolute; top:3px; left:3px; width:22px; height:22px; border-radius:50%;
  background:#fff; transition:.18s; box-shadow:0 1px 3px rgba(0,0,0,.2);}
.switch.on{background:var(--brand-solid);}
.switch.on::after{transform:translateX(18px);}
.radio{width:22px; height:22px; border-radius:50%; border:2px solid var(--line-strong); flex:0 0 22px;
  display:grid; place-items:center; color:transparent;}
.radio.on{border-color:var(--brand); color:var(--brand);}
.radio.on::after{content:""; width:10px; height:10px; border-radius:50%; background:var(--brand); display:block;}

/* 右侧说明 */
.notes{width:300px; flex:0 0 300px; background:var(--doc-panel); border:1px solid var(--doc-line);
  border-radius:var(--r-lg); padding:var(--s5); max-height:calc(100vh - 130px); overflow-y:auto;}
.notes h3{font-size:14px; font-weight:600; color:var(--doc-fg); margin-bottom:var(--s2);}
.notes .route{font-family:var(--font-mono); font-size:11.5px; color:var(--brand);
  background:var(--brand-subtle); padding:5px 9px; border-radius:var(--r-xs); display:inline-block;
  margin-bottom:var(--s4); word-break:break-all;}
.notes h4{font-size:11px; text-transform:uppercase; letter-spacing:.06em; color:var(--doc-muted);
  margin:var(--s4) 0 var(--s2); font-weight:600;}
.notes ul{list-style:none;}
.notes li{font-size:12.5px; line-height:1.7; color:var(--doc-fg); padding-left:14px; position:relative;
  margin-bottom:5px;}
.notes li::before{content:""; position:absolute; left:0; top:8px; width:5px; height:5px;
  border-radius:50%; background:var(--brand); opacity:.5;}
.notes .api{font-family:var(--font-mono); font-size:11px; color:var(--doc-muted); line-height:1.8;
  word-break:break-all;}
.notes .tip{margin-top:var(--s4); padding:var(--s3); background:var(--bg-subtle); border-radius:var(--r-sm);
  font-size:11.5px; line-height:1.7; color:var(--doc-muted);}
@media (max-width:1280px){
  .layout{flex-wrap:wrap; justify-content:center;}
  .notes{width:100%; flex:1 1 100%; max-height:none;}
  .navtree{width:100%; flex:1 1 100%; max-height:none;}
}

/** 复制文本到剪贴板。失败不谎报成功（B-5：复制链接 = 剪贴板动作，不是系统分享）。 */
function copyLink(text){
  const fallback = () => {
    try{
      const ta = document.createElement('textarea');
      ta.value = text; ta.setAttribute('readonly', '');
      ta.style.position = 'fixed'; ta.style.top = '-1000px'; ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select(); ta.setSelectionRange(0, text.length);
      const ok = document.execCommand('copy');
      document.body.removeChild(ta);
      return ok;
    }catch(e){ return false; }
  };
  const settle = (ok) => toast(ok ? '已复制链接' : '当前环境不支持自动复制，请手动复制地址栏链接');
  if(navigator.clipboard && navigator.clipboard.writeText){
    navigator.clipboard.writeText(text).then(() => settle(true), () => settle(fallback()));
  }else{
    settle(fallback());
  }
}

function parseHash(){
  const raw = location.hash.replace(/^#/, '') || '/';
  const [path, qs] = raw.split('?');
  const seg = path.split('/').filter(Boolean);
  return {path, seg, q:new URLSearchParams(qs || '')};
}

/* 路由表定义在最后一个脚本块（见 render 之前）：
   函数声明只在同一个 <script> 块内提升，跨块不会提升，
   若路由表在此处立即求值引用后面的视图函数，会抛 ReferenceError。 */
function matchRoute(seg){
  for(const r of ROUTES){
    const rp = r.p.split('/').filter(Boolean);
    if(rp.length !== seg.length) continue;
    const params = {};
    let ok = true;
    for(let i = 0; i < rp.length; i++){
      if(rp[i].startsWith(':')) params[rp[i].slice(1)] = seg[i];
      else if(rp[i] !== seg[i]){ ok = false; break; }
    }
    if(ok) return {route:r, params};
  }
  return null;
}

function md2html(md){
  const lines = String(md || '').split('\n');
  let h = '', inCode = false, code = '';
  const out = [];
  for(const ln of lines){
    if(ln.trim().startsWith('```')){
      if(inCode){ out.push(`<div class="codebox"><div class="bar"><span>code</span><span></span></div><pre>${esc(code)}</pre></div>`); code = ''; }
      inCode = !inCode; continue;
    }
    if(inCode){ code += ln + '\n'; continue; }
    const t = ln.trim();
    if(!t){ continue; }
    if(t.startsWith('### ')) out.push(`<h3 style="font-size:18px;margin:20px 0 10px">${esc(t.slice(4))}</h3>`);
    else if(t.startsWith('## ')) out.push(`<h2>${esc(t.slice(3))}</h2>`);
    else if(t.startsWith('# ')) out.push(`<h1 style="font-size:24px;margin:20px 0 12px">${esc(t.slice(2))}</h1>`);
    else if(t.startsWith('> ')) out.push(`<blockquote>${esc(t.slice(2))}</blockquote>`);
    else if(t.startsWith('- ')) out.push(`<p style="padding-left:16px">• ${esc(t.slice(2))}</p>`);
    else out.push(`<p>${esc(t)}</p>`);
  }
  if(inCode && code) out.push(`<div class="codebox"><pre>${esc(code)}</pre></div>`);
  h = out.join('');
  return h || '<p style="color:var(--text-muted)">正文还是空的。</p>';
}

  {p:'/member/favorites',            render:vFav,         hideNav:true},
  {p:'/member/likes',                render:vLikes,       hideNav:true},
  {p:'/member/history',              render:vHistory,     hideNav:true},
  {p:'/member/articles',             render:vMyArticles,  hideNav:true},
  {p:'/member/notifications',        render:vNotifications,hideNav:true},
  {p:'/member/profile',              render:vProfile,     hideNav:true},
  {p:'/member/password',             render:vPassword,    hideNav:true},
  {p:'/member/articles/new',         render:vEditor,      hideNav:true},
  {p:'/member/articles/:id/edit',    render:vEditor,      hideNav:true},
  {p:'/member/articles/:id/preview', render:vPreview,     hideNav:true}
];

let lastPath = null;
let lastSig = null;
function render(){
  const {seg} = parseHash();
  const m = matchRoute(seg);
  const appbar = document.getElementById('appbar');
  const screen = document.getElementById('screen');
  const tabbar = document.getElementById('tabbar');
  const overlay = document.getElementById('overlay');
  const caption = document.getElementById('caption');
  const notes = document.getElementById('notes');
  overlay.innerHTML = '';

  if(!m){
    const path = seg.join('/') || '/';
    appbar.innerHTML = `<div class="appbar">
      <button class="iconbtn edge" data-act="back" aria-label="返回">${ico('back')}</button>
      <span class="appbar-title">页面不存在</span></div>`;
    screen.innerHTML = `<div class="fade">${stateBlock('e404', {
      title:'这个地址无法识别', desc:'链接可能已经失效，或者内容已被移除。'})}</div>`;
    tabbar.innerHTML = tabbarHTML(0);
    caption.textContent = '未识别路由 · ' + location.hash;
    notes.innerHTML = notesHTML({route:location.hash, goals:['深链无法识别时进入明确错误页，不留空白'],
      states:['404'], api:[], tip:'无权限与不存在要区分文案，不能统一显示「加载失败」。'});
    document.getElementById('navtree').innerHTML = renderNav('/' + path);
    if(lastPath !== path){ screen.scrollTop = 0; lastPath = path; }
    return;
  }

  const view = m.route.render(m.params) || {};
  appbar.innerHTML = view.appbar || '';
  /* 渲染签名：只包含会影响「已渲染 HTML」的状态。
     编辑器草稿正文不在其中，因此按键不会触发重渲染，输入内容不会被冲掉。 */
  const sig = [
    m.route.p, JSON.stringify(m.params), S.ui, S.auth, S.myFilter, S.searchQ,
    [...S.article.liked].sort().join(','), [...S.article.faved].sort().join(','),
    S.readNotif.size, S.history.length, S.draft.mode, heroIdx,
    [...S.catOpen].sort().join(','),
    MY_DRAFTS.map(d => d.status + d.updatedAt).join('|')
  ].join('~');
  if(lastSig !== sig){
    screen.innerHTML = `<div class="fade">${view.body || ''}</div>`;
    lastSig = sig;
  }
  if(view.bottom) tabbar.innerHTML = view.bottom;
  else if(view.tab) tabbar.innerHTML = tabbarHTML(view.tabIdx || 0);
  else tabbar.innerHTML = '';
  caption.textContent = view.caption || '';
  notes.innerHTML = notesHTML(view.notes);
  document.getElementById('navtree').innerHTML = renderNav(m.route.p);
  if(lastPath !== m.route.p){ screen.scrollTop = 0; lastPath = m.route.p; }
}

/* ================================================================
   交互
   ================================================================ */
function needLogin(){
  if(isIn()) return false;
  S.redirect = location.hash;
  toast('请先登录');
  go('#/login');
  return true;
}
function openSheet(title, html){
  const overlay = document.getElementById('overlay');
  overlay.innerHTML = `<div class="scrim show" data-act="sheet:close"></div>
    <div class="sheet show"><div class="grab"></div>
      <div class="sh"><h3>${esc(title)}</h3>
        <button class="iconbtn edge-r" data-act="sheet:close" aria-label="关闭">${ico('close')}</button></div>
      <div class="sb">${html}</div></div>`;
}
function sheetChoice(text, hint, act, danger){
  return `<div class="row link" data-act="${act}">
    <span class="rt" ${danger ? 'style="color:var(--danger)"' : ''}>${esc(text)}
      ${hint ? `<small>${esc(hint)}</small>` : ''}</span>${ico('chevr', 'arw')}</div>`;
}

function handleAct(act){
  const [k, a, b] = act.split(':');
  switch(k){
    case 'back':
      if(history.length > 1) history.back(); else go('#/');
      break;
    case 'retry': S.ui = 'normal'; render(); break;

    case 'hero':
      if(a === 'next') heroIdx = (heroIdx + 1) % HEROES.length;
      if(a === 'prev') heroIdx = (heroIdx - 1 + HEROES.length) % HEROES.length;
      if(a === 'open'){ go('#/articles/' + (HEROES[heroIdx].slug || HEROES[heroIdx].id)); break; }
      screen_reset();
      render();
      break;

    case 'cat':
      if(a === 'toggle'){
        S.catOpen.has(+b) ? S.catOpen.delete(+b) : S.catOpen.add(+b);
        render();
      }
      break;

    case 'search':
      if(a === 'submit'){
        const el = document.getElementById('q');
        S.searchQ = (el ? el.value : '').trim();
        if(!S.searchQ){ toast('请输入关键词'); break; }
        S.ui = 'normal';
        render();
      }
      if(a === 'quick'){ S.searchQ = b; S.ui = 'normal'; render(); }
      break;

    case 'like': {
      const id = +a;
      if(needLogin()) break;
      const set = S.article.liked;
      const was = set.has(id) || S.liked.has(id);
      if(was){ set.delete(id); S.liked.delete(id); } else { set.add(id); S.liked.add(id); }
      toast(was ? '已取消点赞' : '已点赞');
      render();
      break;
    }
    case 'fav': {
      const id = +a;
      if(needLogin()) break;
      const set = S.article.faved;
      const was = set.has(id) || S.faved.has(id);
      if(was){ set.delete(id); S.faved.delete(id); } else { set.add(id); S.faved.add(id); }
      toast(was ? '已取消收藏' : '已收藏');
      render();
      break;
    }
    case 'share': toast('实现阶段接入系统分享面板'); break;
    case 'reply':
      if(needLogin()) break;
      toast('已定位到该楼层，可开始回复');
      break;
    case 'cmt-del':
      openSheet('评论操作',
        sheetChoice('删除这条评论', '删除后其所有回复会一并删除，不可恢复', 'cmt-del-ok:' + a, true) +
        sheetChoice('取消', '', 'sheet:close'));
      break;
    case 'cmt-del-ok': toast('已删除'); break;
    case 'comment':
      if(needLogin()) break;
      toast('调起评论输入框');
      break;
    case 'article':
      openSheet('文章操作',
        sheetChoice('复制链接', '', 'copy:' + a) +
        sheetChoice('系统分享', '实现阶段接入系统分享面板', 'share:' + a) +
        sheetChoice('取消', '', 'sheet:close'));
      break;
    case 'copy': {
      const art = ARTICLES.find(x => String(x.id) === String(a));
      copyLink(location.origin + location.pathname + '#/articles/' + (art ? (art.slug || art.id) : a));
      break;
    }
    case 'toc:panel':
      openSheet('本文目录',
        TOC.map(t => sheetChoice(t.t, t.lv2 ? '二级标题' : '一级标题', 'toc:' + t.n)).join('') +
        sheetChoice('取消', '', 'sheet:close'));
      break;
    case 'toc':
      render();
      toast('目录已定位到对应章节');
      break;

    case 'auth':
      if(a === 'submit'){
        S.ui = 'normal'; S.auth = 'in';
        const back = S.redirect || '#/member';
        S.redirect = null;
        toast('登录成功');
        go(back);
      }
      break;
    case 'logout':
      openSheet('退出登录',
        sheetChoice('确认退出', '会清除本机保存的登录状态与私有缓存', 'logout-ok', true) +
        sheetChoice('取消', '', 'sheet:close'));
      break;
    case 'logout-ok':
      S.auth = 'out'; S.liked.clear(); S.faved.clear(); S.history = [];
      render(); toast('已退出登录'); go('#/');
      break;

    case 'notif':
      if(a === 'read'){ S.readNotif.add(+b); render(); }
      if(a === 'readall'){ NOTIFICATIONS.forEach(n => S.readNotif.add(n.id)); render(); toast('已全部标为已读'); }
      break;
    case 'history':
      if(a === 'clear'){
        openSheet('清空阅读历史', sheetChoice('确认清空', '清空后无法恢复', 'history-clear-ok', true) +
          sheetChoice('取消', '', 'sheet:close'));
      }
      break;
    case 'history-clear-ok': S.history = []; render(); toast('已清空'); break;

    case 'filter': S.myFilter = a; render(); break;
    case 'draft':
      if(a === 'edit'){ go('#/member/articles/' + b + '/edit'); }
      if(a === 'submit' || a === 'resubmit'){
        const d = MY_DRAFTS.find(x => String(x.id) === String(b));
        if(d){ d.status = 'pending'; d.updatedAt = '刚刚'; }
        render(); toast('已提交审核，等待管理员通过');
      }
      if(a === 'del'){
        openSheet('删除稿件', sheetChoice('删除《' +
          ((MY_DRAFTS.find(x => String(x.id) === String(b)) || {}).title || '') + '》',
          '删除后无法恢复', 'draft-del-ok:' + b, true) + sheetChoice('取消', '', 'sheet:close'));
      }
      break;
    case 'draft-del-ok': {
      const i = MY_DRAFTS.findIndex(x => String(x.id) === String(a));
      if(i > -1) MY_DRAFTS.splice(i, 1);
      render(); toast('已删除');
      break;
    }

    case 'editor':
      if(a === 'mode'){ S.draft.mode = b; render(); }
      if(a === 'close'){
        openSheet('离开编辑器', sheetChoice('保存草稿后离开', '未提交的内容会保留在本机', 'editor-save-leave') +
          sheetChoice('直接离开', '未保存的改动会丢失', 'editor-leave', true) +
          sheetChoice('继续编辑', '', 'sheet:close'));
      }
      if(a === 'save' || a === 'save-leave'){ render(); toast('草稿已保存到本机'); }
      if(a === 'submit'){
        S.draft.mode = 'edit'; render();
        toast('已提交审核，状态变为待审核');
      }
      if(a === 'more') toast('可在此清空本机恢复副本');
      break;
    case 'editor-save-leave': toast('草稿已保存'); go('#/member/articles'); break;
    case 'editor-leave': go('#/member/articles'); break;
    case 'md': toast('编辑器工具栏在实现阶段做技术 Spike 后再定'); break;

    case 'setting':
      if(b){ S.themeMode = b; applyTheme(b); render(); toast('主题已切换：' + (b === 'light' ? '浅色' : b === 'dark' ? '深色' : '跟随系统')); }
      break;
    case 'profile': toast('资料已保存'); break;
    case 'upload': toast('调起系统图片选择'); break;
    case 'password':
      if(a === 'submit'){
        const n1 = document.getElementById('np'), n2 = document.getElementById('np2');
        if(n1 && n2 && n1.value && n1.value !== n2.value){ toast('两次输入的新密码不一致'); break; }
        toast('密码已修改，其他设备会话将失效');
      }
      break;

    case 'sheet': render(); break;
    default: break;
  }
}
function screen_reset(){
  const s = document.getElementById('screen');
  if(s) s.scrollTop = 0;
}

/* 主题 */
function applyTheme(mode){
  S.themeMode = mode;
  let t = mode;
  if(mode === 'system') t = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
  S.theme = t;
  document.documentElement.setAttribute('data-theme', t);
  document.querySelectorAll('[data-theme-set]').forEach(b =>
    b.setAttribute('aria-pressed', String(b.dataset.themeSet === mode)));
}

/* 事件绑定 */
document.addEventListener('click', (e) => {
  const navEl = e.target.closest('[data-nav]');
  if(navEl){
    e.preventDefault();
    const h = navEl.getAttribute('data-nav');
    if(h === '#/' && location.hash === '' ){ render(); } else { go(h); }
    return;
  }
  const actEl = e.target.closest('[data-act]');
  if(actEl){ e.preventDefault(); handleAct(actEl.getAttribute('data-act')); }
});
document.addEventListener('keydown', (e) => {
  if(e.target.id === 'q' && e.key === 'Enter'){
    S.searchQ = e.target.value.trim();
    if(S.searchQ) render(); else toast('请输入关键词');
  }
});
document.addEventListener('input', (e) => {
  const t = e.target;
  if(t.id === 'q'){ S.searchQ = t.value; return; }
  if(t.dataset && t.dataset.draft){ S.draft[t.dataset.draft] = t.value; }
  if(t.hasAttribute && t.hasAttribute('data-tagfilter')){
    const v = t.value.trim().toLowerCase();
    document.querySelectorAll('#tagTiles .tile').forEach(el => {
      el.style.display = el.textContent.toLowerCase().includes(v) ? '' : 'none';
    });
  }
});
window.addEventListener('hashchange', () => render());

/* 顶部工具条 */
document.querySelectorAll('[data-theme-set]').forEach(b =>
  b.addEventListener('click', () => { applyTheme(b.dataset.themeSet); render(); }));
document.querySelectorAll('[data-state-set]').forEach(b =>
  b.addEventListener('click', () => {
    S.ui = b.dataset.stateSet;
    document.querySelectorAll('[data-state-set]').forEach(x =>
      x.setAttribute('aria-pressed', String(x === b)));
    render();
  }));
document.querySelectorAll('[data-auth-set]').forEach(b =>
  b.addEventListener('click', () => {
    S.auth = b.dataset.authSet === 'in' ? 'in' : 'out';
    document.querySelectorAll('[data-auth-set]').forEach(x =>
      x.setAttribute('aria-pressed', String(x === b)));
    render();
  }));

/* 初始化 */
(function init(){
  const toastEl = document.createElement('div');
  toastEl.className = 'toast'; toastEl.id = 'toast';
  document.getElementById('device').appendChild(toastEl);

  const params = new URLSearchParams(location.search);
  const t = params.get('theme');
  applyTheme(t === 'dark' || t === 'light' ? t : (t === 'system' ? 'system' : 'light'));

  if(!location.hash) location.hash = '#/';
  document.getElementById('navtree').innerHTML = renderNav('/');
  render();
})();
</script>
